name: Derle

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  paket:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      # Bir işletim sistemi düşerse diğerleri yine derlensin.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --publish never
      # main dalından elle başlatılan derleme ya da v* etiketi sürüm yayınlar: dosyalar Sürümler sayfasına
      # konur (Actions depolamasına sayılmaz, indirmek için giriş gerekmez). Diğer dallar Actions'a yükler.
      - id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - if: steps.rel.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: zar-masasi-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          # Eski derlemeler depolama kotasını doldurmasın.
          retention-days: 14
      - if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Zar Masası ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  # Android uygulaması (APK). Çekme isteklerinde denemek için Actions'a, sürüm yayınında Sürümler sayfasına konur.
  android:
    needs: [test, paket]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.paket.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobil-uygulama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap add android
      # Sunucu çoğu zaman yalnızca http:// (HTTPS'siz) olduğu için düz bağlantıya izin ver.
      - run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
      # Uygulama simgesi (mobil-uygulama/simgeler, web/mobil/ikon.svg'den üretildi).
      - name: Simgeler
        run: |
          cp -r simgeler/. android/app/src/main/res/
          sed -i 's/#FFFFFF/#1F6F6B/I' android/app/src/main/res/values/ic_launcher_background.xml
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobil-uygulama/android
      - id: rel
        shell: bash
        run: |
          V=$(node -p "require('../package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "ZarMasasi-$V-android.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then echo "tag=v$V" >> "$GITHUB_OUTPUT"; fi
      - if: steps.rel.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: zar-masasi-android
          path: mobil-uygulama/ZarMasasi-*-android.apk
          retention-days: 7
      - if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Zar Masası ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: mobil-uygulama/ZarMasasi-*-android.apk
