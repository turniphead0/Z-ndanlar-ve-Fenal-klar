<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zar Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: masa düzeni — sol menü rayı, ortada çalışma alanı, sağda kalıcı zar tepsisi */
:root{
  --bg:#E7EBE7; --surface:#F7F9F6; --surface-2:#EEF2EE; --ink:#1B2226; --muted:#5A666A; --line:#C8D0CB;
  --accent:#1F6F6B; --accent-ink:#FFFFFF; --accent-soft:#D3E6E2; --gold:#93680F; --gold-soft:#F1E3C2;
  --bad:#B3261E; --good:#2E7D32;
  --t-wall:#3C4247; --t-water:#7FAED0; --t-rough:#C4A86B; --t-door:#8A5A2B; --grid:rgba(27,34,38,.16); --map-floor:#F2F4F0;
  --t-tree:#5E8B4E; --t-pit:#2A2F33; --t-lava:#D2522B; --t-stairs:#A39780; --t-trap:#B3261E; --fog:#262C31;
  --f-display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --surface:#192025; --surface-2:#1F272D; --ink:#E3E8E4; --muted:#93A0A3; --line:#2C363C;
  --accent:#55B5AB; --accent-ink:#0D1A19; --accent-soft:#1D3734; --gold:#DDB050; --gold-soft:#3A3020;
  --bad:#F1766B; --good:#71C47E;
  --t-wall:#6B757C; --t-water:#2E5E80; --t-rough:#7C6737; --t-door:#B07A44; --grid:rgba(227,232,228,.12); --map-floor:#1C2328;
  --t-tree:#3F6B35; --t-pit:#07090B; --t-lava:#C2461F; --t-stairs:#6E6555; --t-trap:#F1766B; --fog:#05070A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518; --surface:#192025; --surface-2:#1F272D; --ink:#E3E8E4; --muted:#93A0A3; --line:#2C363C;
  --accent:#55B5AB; --accent-ink:#0D1A19; --accent-soft:#1D3734; --gold:#DDB050; --gold-soft:#3A3020;
  --bad:#F1766B; --good:#71C47E;
  --t-wall:#6B757C; --t-water:#2E5E80; --t-rough:#7C6737; --t-door:#B07A44; --grid:rgba(227,232,228,.12); --map-floor:#1C2328;
  --t-tree:#3F6B35; --t-pit:#07090B; --t-lava:#C2461F; --t-stairs:#6E6555; --t-trap:#F1766B; --fog:#05070A;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:76px minmax(0,1fr) 320px;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px}
.brand{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-align:center;color:var(--accent);line-height:1.1;margin-bottom:10px}
.brand svg{display:block;margin:0 auto 4px}
.navbtn{width:62px;border:0;background:none;border-radius:var(--r);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn:hover{color:var(--ink)}
.sync{margin-top:auto;font-size:10.5px;color:var(--muted);text-align:center;padding:0 4px}
.sync i{display:block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin:0 auto 3px}
.sync[data-s="ok"] i{background:var(--good)} .sync[data-s="err"] i{background:var(--bad)}

main{overflow:auto;min-width:0;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:20px;padding-block:18px 40px}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vhead h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.vhead .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7;margin-left:4px}

input.f,select.f,textarea.f{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;width:100%;min-width:0}
textarea.f{resize:vertical;min-height:110px;line-height:1.5}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent);outline:none}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0;font-size:20px}

/* ---------- Karakter kağıdı ---------- */
.sheet{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.panel>h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px;letter-spacing:.04em;color:var(--accent);display:flex;align-items:center;gap:8px}
.idrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 12px}
.idrow label{display:grid;gap:2px}
.cname{font-family:var(--f-display);font-size:28px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;padding:2px 0;margin-bottom:10px}
.cname:focus{outline:none;border-color:var(--accent)}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.vit{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;text-align:center;background:var(--surface-2);display:grid;gap:2px;align-content:start}
.vit .big{font-family:var(--f-num);font-size:22px;font-weight:700;background:none;border:0;text-align:center;width:100%;padding:0}
.vit button.big{color:var(--accent)}
.vit input.big{border-bottom:1px dashed var(--line)}
.cols{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.abil{display:grid;gap:8px}
.ab{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:6px;background:var(--surface-2)}
.ab .modb{padding:0;display:grid;place-items:center;font-family:var(--f-num);font-size:22px;font-weight:700;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:var(--r);height:46px}
.ab .modb:hover{background:var(--accent);color:var(--accent-ink)}
.ab .meta{display:grid;gap:3px}
.ab .nm{font-family:var(--f-display);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:4px}
.ab input.score{width:52px;text-align:center;font-family:var(--f-num);padding:2px}
.saverow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rowlist{display:grid}
.rl{display:grid;grid-template-columns:24px 1fr auto 44px;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);font-size:14px}
.rl:last-child{border-bottom:0}
.rl .abk{font-size:11px;color:var(--muted);letter-spacing:.05em}
.prof{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:none;padding:0;display:grid;place-items:center}
.prof[data-v="1"]{background:var(--accent);border-color:var(--accent)}
.prof[data-v="2"]{background:var(--gold);border-color:var(--gold);border-radius:3px;transform:rotate(45deg) scale(.85)}
.rollb{font-family:var(--f-num);font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:2px 0;color:var(--accent)}
.rollb:hover{border-color:var(--accent);background:var(--accent-soft)}
.hpbar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)} .hpbar i.mid{background:var(--gold)}
.hpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hpgrid label{display:grid;gap:2px;text-align:center}
.hpgrid input{text-align:center;font-family:var(--f-num);font-size:18px;font-weight:700}
.hpact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hpact input{width:70px;text-align:center}
.ds{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;align-items:center}
.ds span{display:flex;gap:4px;align-items:center}
.ds input{accent-color:var(--accent);width:16px;height:16px}
.atk{display:grid;grid-template-columns:minmax(0,1.4fr) 62px minmax(0,1.2fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.resg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dmgw{display:flex;gap:4px;min-width:0}.dmgw .f{min-width:0;flex:1 1 0}.dmgw .dtype{flex:1.2 1 0}
.atkh{font-size:11px}
.cond{display:flex;flex-wrap:wrap;gap:5px}
.cond .chip{font-size:13px;padding:2px 9px}
.cond .chip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:4px 6px;font-size:12px;display:grid;gap:3px;background:var(--surface-2)}
.slot .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.slot input{width:38px;padding:1px 4px;text-align:center;font-family:var(--f-num)}
.pips{display:flex;gap:3px;flex-wrap:wrap;min-height:14px}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent);background:var(--accent);padding:0}
.pip.used{background:transparent}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.coins label{display:grid;gap:2px;text-align:center}
.coins input{text-align:center;font-family:var(--f-num);padding:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.spellstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.spellstat b{font-family:var(--f-num)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.toggle input{accent-color:var(--gold);width:16px;height:16px}

/* ---------- Notlar ---------- */
.notes{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.nlist{display:grid;gap:6px;max-height:calc(100vh - 190px);overflow:auto;padding-right:2px}
.nitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px}
.nitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nitem b{font-weight:700;display:flex;gap:6px;align-items:center}
.nitem small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--accent)}
.tag[data-c="NPC"]{color:var(--gold)} .tag[data-c="Görev"]{color:var(--bad)}
.ned{display:grid;gap:10px}
.ned .ttl{font-family:var(--f-display);font-size:24px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 0;width:100%}
.ned .ttl:focus{outline:none;border-color:var(--accent)}
.ned textarea{min-height:46vh;font-size:15.5px}
.nbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nbar select{width:auto}
.searchrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.searchrow input{flex:1;min-width:150px}

/* ---------- Harita ---------- */
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 9px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tool i{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);max-height:calc(100vh - 230px)}
#mapc{display:block;touch-action:none}
#mapc.pan{touch-action:auto}
.measure{font-family:var(--f-num);font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}
.side{display:grid;gap:12px}
.tok{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.tok:last-child{border-bottom:0}
.tok .dot{width:16px;height:16px;border-radius:50%;flex:none}
img.dot{width:22px!important;height:22px!important;object-fit:cover;border:2px solid;box-sizing:border-box}
.tokimg{display:flex;gap:10px;align-items:center}.tokimg img,.tokimg .dot{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line)}
.tok button.nm{flex:1;text-align:left;background:none;border:0;padding:0}
.tok[aria-current="true"] button.nm{font-weight:700;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fgrid label{display:grid;gap:2px}
.fgrid .w2{grid-column:span 2}
input[type=color].f{padding:1px;height:32px}

/* ---------- Zar tepsisi ---------- */
.tray{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:16px;padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px}
.tray h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--surface);padding:6px 2px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.die{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 0 6px;display:grid;justify-items:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:14px}
.die svg{width:26px;height:26px;color:var(--accent)}
.die:hover{border-color:var(--accent)}
.die:active{transform:translateY(1px)}
.exprrow{display:flex;gap:6px;margin-bottom:12px}
.exprrow input{font-family:var(--f-num)}
.result{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2);text-align:center;margin-bottom:12px}
.result .tot{font-family:var(--f-num);font-size:46px;font-weight:700;line-height:1}
.result .rl2{font-weight:700;margin-bottom:4px}
.result .det{font-family:var(--f-num);font-size:12.5px;color:var(--muted);word-break:break-word}
.result.n20{border-color:var(--gold);background:var(--gold-soft)} .result.n20 .tot{color:var(--gold)}
.result.n1{border-color:var(--bad)} .result.n1 .tot{color:var(--bad)}
.result.anim .tot{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg);opacity:.3}100%{transform:none;opacity:1}}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 7px;border-radius:999px;margin-top:6px}
.badge.g{background:var(--gold);color:var(--surface)} .badge.b{background:var(--bad);color:var(--surface)}
.logh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.log{overflow:auto;flex:1;min-height:80px;display:grid;align-content:start}
.le{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.le .t{font-family:var(--f-num);font-weight:700;font-size:16px;text-align:right;grid-row:span 2;align-self:center}
.le .t.n20{color:var(--gold)} .le .t.n1{color:var(--bad)}
.le small{color:var(--muted);font-family:var(--f-num);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trayfab{display:none}
.peers{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:12px;background:var(--surface-2);display:grid;gap:6px}
#peerList{display:grid;gap:5px;max-height:150px;overflow:auto}
.peer{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.2}
.peer small{display:block;color:var(--muted);font-size:11.5px}
.peer b small{display:inline;color:var(--gold)}
.pdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.rby{font-weight:700}
.joinov{position:fixed;inset:0;z-index:100;background:rgba(10,14,16,.55);display:grid;place-items:center;padding:16px}
.joincard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.joincard h2{font-family:var(--f-display);margin:0;font-size:24px}.joincard p{margin:0;color:var(--muted)}
.joincard label{display:grid;gap:4px}.jcolors{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.jc{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.jc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.jerr{color:var(--bad)!important;font-weight:700}
.robanner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:var(--r);font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,220px) minmax(0,1fr)}
  .cols>.c3{grid-column:1 / -1}
}
@media (max-width:1000px){
  .app{grid-template-columns:76px minmax(0,1fr)}
  .tray{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .tray:not(.open){display:none}
  .trayfab{display:inline-flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-weight:700}
  .maplay{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){

.avol .num{text-align:right;font-size:13px;color:var(--muted)}
.asec{margin:0 0 10px}
#main > section{margin-bottom:22px}
.catchips .chip{font-size:15px;padding:6px 14px}
.ambline{margin:6px 0 0;font-size:14px;display:flex;gap:6px;align-items:center}
.ytbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.ytbox .btn small,.nowbar .btn small{font-weight:500;opacity:.8;margin-left:4px}
.ytform{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ytform #ytUrl{flex:2;min-width:220px}.ytform #ytTitle{flex:1;min-width:140px}
.ytag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.nowbar a.btn{text-decoration:none}

.gengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:6px}
.gencard{display:grid;gap:6px;align-content:start}
.gencard h3{font-family:var(--f-display);font-size:18px;margin:0}
.gencard p{margin:0;font-size:13.5px;color:var(--muted)}
.gencard.on{border-color:var(--accent);background:var(--accent-soft)}
.gtag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.tlist{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:4px}
.tlist li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px}
.tlist li.on{border-color:var(--accent);background:var(--accent-soft)}
.tn{width:22px;color:var(--muted);font-size:13px}
.tt{flex:1;min-width:0;display:grid}.tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tt small{color:var(--muted);font-size:12px}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:6px}
.padw{position:relative}
.pad{width:100%;min-height:72px;border:1px solid var(--line);border-bottom-width:4px;border-radius:8px;background:var(--surface);display:grid;place-items:center;padding:8px 6px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;position:relative;transition:transform .06s}
.pad:hover:not(:disabled){border-color:var(--accent)}
.pad:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.pad:disabled{opacity:.6;cursor:default}
.pad kbd{position:absolute;top:4px;right:6px;font-family:var(--f-num);font-size:10.5px;color:var(--muted);font-weight:500}
.pad.hit{animation:padhit .9s ease-out}
@keyframes padhit{0%{background:var(--gold);color:#1b1404;border-color:var(--gold)}100%{background:var(--surface)}}
.padx{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);font-size:12px;line-height:1;padding:0}
@media (max-width:1000px){ .audio{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ .eq.on i{animation:none;height:70%} .pad.hit{animation:none} }
@media (prefers-reduced-motion:reduce){.result.anim .tot{animation:none}.hpbar i{transition:none}}

/* Veri yapısı:
   games/<oyun>                      oyun belgesi (ad, DM'ler, oyuncular, istekler)
   games/<oyun>/{chars,notes,maps,combat,rolls}/<belge>   oyundaki herkesin ortak verisi
   data/users/<kişi>/g-<oyun>/{monsters,dmnotes}/<belge>  her DM'in kendi gizli verisi (sunucu başkasına göstermez) */
const SHARED=["chars","notes","maps","combat","handouts","audio","tracks","sfx"], PRIV=["monsters","dmnotes","scenario"];
const G={id:null,role:"none"};
const pend={}, remoteP=new Set();
function colPath(col,gid=G.id){ return PRIV.includes(col)?`data/users/${ME.id}/g-${gid}/${col}`:`games/${gid}/${col}` }
function buildPatch(obj,paths){
  const out={};
  for(const p of paths){ const ks=p.split("."); const ai=ks.findIndex((k,i)=>Array.isArray(getPath(obj,ks.slice(0,i+1).join("."))));
    const kk=ai>=0?ks.slice(0,ai+1):ks; const v=getPath(obj,kk.join(".")); setPath(out,kk.join("."),v===undefined?null:clone(v)) }
  return out;
}
function deepMerge(a,b){ for(const [k,v] of Object.entries(b)){ if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],v); else a[k]=v } return a }
/* Eş zamanlı kayıt: değişen alanlar "update" ile birleştirilir; iki kişi aynı belgenin farklı alanlarını aynı anda düzenleyebilir. */
function persistRef(ref,patch,obj){
  const k=ref.path; const p=pend[k]||(pend[k]={chain:Promise.resolve(),timer:0,dirty:false,patch:null,full:false,obj:null});
  p.dirty=true; p.ver=(p.ver||0)+1; p.obj=obj; clearTimeout(p.timer);
  if(patch) p.patch=deepMerge(p.patch||{},patch); else p.full=true;
  setSync("wait","Kaydediliyor");
  p.timer=setTimeout(()=>{
    p.chain=p.chain.then(async()=>{
      const ver=p.ver, o=p.obj, full=p.full||!remoteP.has(k), pt=p.patch; p.patch=null; p.full=false;
      try{
        if(!o){ await ref.delete(); remoteP.delete(k) }
        else if(full){ await ref.set(clone(o)); remoteP.add(k) }
        else if(pt) await ref.update(pt);
        setSync("ok","Senkron");
      }catch(e){
        if(e&&e.code==="invalid_argument"&&o&&!full){ try{ await ref.set(clone(o)); remoteP.add(k); setSync("ok","Senkron"); return }catch(e2){ e=e2 } }
        setSync("err", e&&e.code==="quota_exceeded"?"Depo dolu":"Kaydedilemedi");
        if(e&&e.code==="invalid_argument") readOnly(true);
      }finally{ if(p.ver===ver) p.dirty=false }
    });
  },450);
}
function isDirty(path){ return !!(pend[path]&&pend[path].dirty) }
function save(col,obj,paths){ if(S.ro){toast("Bu masada yalnızca görüntüleme iznin var");return} if(!G.id) return; obj.updated=Date.now(); S[col][obj.id]=obj; persistRef(DB.collection(colPath(col)).doc(obj.id),paths?buildPatch(obj,[...paths,"updated"]):null,obj) }
function del(col,id){ if(S.ro){toast("Bu masada yalnızca görüntüleme iznin var");return} delete S[col][id]; persistRef(DB.collection(colPath(col)).doc(id),null,null) }
function saveGame(g,paths){ if(S.ro){toast("Bu masada yalnızca görüntüleme iznin var");return} g.updated=Date.now(); S.games[g.id]=g; persistRef(DB.collection("games").doc(g.id),paths?buildPatch(g,[...paths,"updated"]):null,g) }
function normMap(m){ if(!m) return m; if(Array.isArray(m.tokens)) m.tokens=Object.fromEntries(m.tokens.map(t=>[t.id,t])); m.tokens=m.tokens||{}; m.cells=m.cells||{}; m.props=m.props||{}; m.labels=m.labels||{}; m.fog=m.fog||{}; return m }
function toks(m){ return Object.values(m.tokens||{}).filter(t=>t&&!t.removed).sort((a,b)=>a.id<b.id?-1:1) }
function readOnly(on){ if(S.ro===on) return; S.ro=on; render() }

function editing(){ const a=document.activeElement; return a && ($("#main").contains(a)||$("#lobby").contains(a)) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="checkbox" && a.type!=="file" }

/* Tarayıcı içi yedek veri katmanı: Claude dışında açıldığında (önizleme) aynı arayüzle localStorage kullanır */
function makeLocalDB(){
  const KEY="zar-masasi-db-v2"; let store={}; try{ store=JSON.parse(localStorage.getItem(KEY))||{} }catch(e){}
  const subs=new Set(); const keep=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)) }catch(e){} };
  const parent=p=>p.split("/").slice(0,-1).join("/");
  const dobj=(path,d)=>({id:path.split("/").pop(),exists:d!==undefined,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const notify=()=>subs.forEach(fn=>fn());
  const run=(col,f,dir,n)=>{ let a=Object.entries(store).filter(([p])=>parent(p)===col).map(([p,d])=>dobj(p,d)); if(f){ const m=dir==="desc"?-1:1; a.sort((x,y)=>{const u=x.data()[f],v=y.data()[f];return (u>v?1:u<v?-1:0)*m}) } return n?a.slice(0,n):a };
  const docRef=path=>({ id:path.split("/").pop(), path,
    get:async()=>dobj(path,store[path]),
    set:async d=>{ store[path]=clone(d); keep(); notify() },
    update:async d=>{ if(!store[path]) throw {code:"invalid_argument",message:"yok"}; store[path]=deepMerge(clone(store[path]),clone(d)); keep(); notify() },
    delete:async()=>{ delete store[path]; keep(); notify() },
    collection:c=>q(path+"/"+c),
    onSnapshot(fn){ let last; const r=()=>{ const d=store[path]; if(d!==last){ last=d; fn(dobj(path,d)) } }; subs.add(r); setTimeout(r,0); return ()=>subs.delete(r) } });
  const q=(col,f,dir,n)=>({ path:col, orderBy:(f2,d2="asc")=>q(col,f2,d2,n), limit:n2=>q(col,f,dir,n2), doc:id=>docRef(col+"/"+(id||uid("d"))),
    get:async()=>{ const docs=run(col,f,dir,n); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}} },
    onSnapshot(fn){ let last=new Map(); const r=()=>{ const docs=run(col,f,dir,n), now=new Map(docs.map(d=>[d.id,d.data()])), ch=[];
        for(const d of docs){ if(!last.has(d.id)) ch.push({type:"added",doc:d}); else if(last.get(d.id)!==d.data()) ch.push({type:"modified",doc:d}) }
        for(const [id,v] of last) if(!now.has(id)) ch.push({type:"removed",doc:dobj(col+"/"+id,v)});
        if(!ch.length&&last.size&&last.size===now.size) return; last=now;
        fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>ch,metadata:{fromCache:false,hasPendingWrites:false}}) };
      subs.add(r); setTimeout(()=>{ last=new Map(); const docs=run(col,f,dir,n); last=new Map(docs.map(d=>[d.id,d.data()])); fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map(d=>({type:"added",doc:d})),metadata:{fromCache:false,hasPendingWrites:false}}) },0);
      return ()=>subs.delete(r) } });
  return { collection:c=>q(c), doc:docRef };
}

let USER=null, ROOM=null, ME={id:null}, PEERS=[], LOCAL=false, IS_OWNER=false;
const PROF={}, remoteDrag={}, pings=[];
const who=id=>!id?"":id===ME.id?"Sen":(PROF[id]?.name||"Bir oyuncu");
const nameOf=id=>!id?"":id===ME.id?(ME.name||"Sen"):(PROF[id]?.name||"Bir oyuncu");
const peerColor=id=>PROF[id]?.color||"#c08a1e";
async function resolveNames(ids){
  if(!USER) return; const miss=[...new Set(ids)].filter(i=>i&&!PROF[i]); if(!miss.length) return;
  miss.forEach(i=>PROF[i]=PROF[i]||{name:"",color:"#c08a1e",pending:true});
  try{ const ps=await USER.profiles(miss); for(const [id,p] of Object.entries(ps)) PROF[id]={name:p.name||"Bir oyuncu",color:p.color||"#c08a1e",guest:p.guest}; renderPeers(); renderLog(); drawMap(); softRender() }catch(e){}
}
const VIEWN={karakterler:"Karakterler",notlar:"Notlar",harita:"Harita",savas:"Savaş",oyun:"Oyun",ses:"Ses",senaryo:"Senaryo"};
function peersHere(){ const by=new Map(); for(const p of PEERS){ if((p.presence||{}).g!==G.id&&!p.isMe) continue; const k=p.by||p.peer; if(!by.has(k)||p.isMe) by.set(k,p) } return [...by.values()].sort((a,b)=>(b.isMe-a.isMe)) }
function renderPeers(){
  const el=$("#peers"); if(!el) return;
  if(!ROOM||!G.id){ el.hidden=true; return } el.hidden=false;
  const list=peersHere(), g=S.games[G.id];
  $("#peerList").innerHTML=list.map(p=>{ const pr=p.presence||{}; let where=VIEWN[pr.view]||""; if(pr.view==="harita"&&S.maps[pr.m]&&(isDM()||!S.maps[pr.m].hidden)) where+=": "+S.maps[pr.m].name; if(pr.view==="karakterler"&&S.chars[pr.c]) where+=": "+S.chars[pr.c].name;
    const nm=p.isMe?"Sen":(p.kind==="agent"?"Claude":who(p.by)); const col=p.isMe?(ME.color||"var(--accent)"):peerColor(p.by); const r=roleOf(g,p.by);
    return `<div class="peer"><span class="pdot" style="background:${esc(col)}">${esc((nm[0]||"?").toLocaleUpperCase("tr"))}</span><span><b>${esc(nm)}</b>${r==="dm"?' <small class="rtag">DM</small>':""}<small>${esc(where)}</small></span></div>` }).join("");
  $("#peerCount").textContent=list.length;
  $("#trayFab").textContent=`Zar tepsisi · ${list.length} kişi`;
}
let lastPres="";
function updatePresence(extra){
  if(!ROOM) return; const p={g:G.id||null,view:G.id?S.view:"lobi",m:G.id&&S.view==="harita"?S.mapId:null,c:G.id&&S.view==="karakterler"?S.charId:null,...(extra||{})};
  const j=JSON.stringify(p); if(j===lastPres) return; lastPres=j; ROOM.presence(p).catch(()=>{});
}
let curT=0; function presenceCursor(cur){ if(!ROOM) return; const n=performance.now(); if(cur&&n-curT<120) return; curT=n; ROOM.presence({cur}).catch(()=>{}) }
let dragT=0; function emitDrag(d,force){ if(!ROOM) return; const n=performance.now(); if(!force&&n-dragT<50) return; dragT=n; ROOM.emit("drag",d).catch(()=>{}) }
let pingRaf=0; function animPings(){ if(pingRaf) return; const step=()=>{ const now=performance.now(); while(pings.length&&now-pings[0].t>1600) pings.shift(); drawMap(); pingRaf=pings.length?requestAnimationFrame(step):0 }; pingRaf=requestAnimationFrame(step) }

/* ================= Oyunlar ve roller ================= */
function roleOf(g,id=ME.id){ if(!g||!id) return "none"; if(g.dms&&g.dms[id]) return "dm"; if(g.players&&g.players[id]) return "player"; if(g.pending&&g.pending[id]) return "pending"; return "none" }
function members(g){ const ids=new Set(); Object.entries(g.dms||{}).forEach(([k,v])=>v&&ids.add(k)); Object.entries(g.players||{}).forEach(([k,v])=>v&&ids.add(k)); return [...ids] }
function myCharId(){ const g=S.games[G.id]; return g&&g.players&&g.players[ME.id]&&g.players[ME.id].charId||Object.values(S.chars).find(c=>c.owner===ME.id)?.id||null }
const canEditChar=c=>!!c&&(isDM()||(!!c.owner&&c.owner===ME.id));
const ownsTok=t=>isDM()||(!!t.charId&&S.chars[t.charId]?.owner===ME.id);
const tokImg=t=>(t.charId&&S.chars[t.charId]?.portrait)||t.img||"";
let gameUnsubs=[];
function subscribeGame(){
  try{ auStopAll() }catch(e){}
  gameUnsubs.forEach(f=>{try{f()}catch(e){}}); gameUnsubs=[];
  COLS.forEach(c=>{ S[c]={}; S.loaded[c]=false }); S.log=[]; S.slog=[]; lastTurnKey=null;
  if(!G.id) return;
  const gid=G.id, cols=[...SHARED,...(G.role==="dm"&&ME.id?PRIV:[])];
  COLS.filter(c=>!cols.includes(c)).forEach(c=>S.loaded[c]=true);
  for(const col of cols){
    const path=colPath(col,gid);
    gameUnsubs.push(DB.collection(path).onSnapshot(snap=>{
      if(G.id!==gid) return;
      for(const ch of snap.docChanges()){
        const id=ch.doc.id, k=path+"/"+id;
        if(ch.type==="removed"){ remoteP.delete(k); if(!isDirty(k)) delete S[col][id]; continue }
        remoteP.add(k); if(isDirty(k)) continue;
        const d=clone(ch.doc.data()); S[col][id]=col==="maps"?normMap(d):d;
      }
      if(!snap.metadata.fromCache) S.loaded[col]=true;
      setSync("ok","Senkron");
      if(col==="combat") announceTurn();
      if(col==="audio"||col==="tracks") applyAudioState(S.audio.state);
      if(col==="handouts"&&S.loaded.handouts&&!snap.metadata.fromCache&&G.role!=="dm") for(const ch of snap.docChanges()) if(ch.type==="added"&&Date.now()-(ch.doc.data().shownAt||0)<60000) toast(`Yeni el notu: ${ch.doc.data().title}`);
      if(col==="chars"&&G.role==="player"&&!S.charId) S.charId=myCharId();
      softRender();
    },()=>setSync("err","Bağlantı kesildi")));
  }
  let first=true;
  gameUnsubs.push(DB.collection(colPath("rolls",gid)).orderBy("t","desc").limit(60).onSnapshot(snap=>{
    if(G.id!==gid) return; const fresh=[];
    if(!first) for(const ch of snap.docChanges()) if(ch.type==="added"){ const d=ch.doc.data(); if(d.by!==ME.id&&Date.now()-d.t<20000) fresh.push(clone(d)) }
    first=false; S.log=snap.docs.map(d=>clone(d.data()));
    resolveNames(S.log.map(x=>x.by).filter(Boolean)); renderLog();
    fresh.sort((a,b)=>a.t-b.t).forEach(d=>{ showResult(d); diceSound(d); toast(`${who(d.by)} · ${d.label}: ${d.total}${d.crit==="20"?" — Doğal 20!":d.crit==="1"?" — Doğal 1":""}`) });
  },()=>{}));
}
function enterGame(gid){
  const g=S.games[gid]; if(!g) return; const r=roleOf(g);
  if(r!=="dm"&&r!=="player"){ toast("Bu oyuna önce katılman gerekiyor"); return }
  G.id=gid; G.role=r; S.asPlayer=false; S.charId=null; S.mapId=null; S.noteId=null; S.noteCat="Tümü"; S.selTok=null; S.selLab=null; S.monId=null; S.tool="move";
  S.view=window.ZM_POP||(r==="dm"?"harita":"karakterler");
  try{ history.replaceState(null,"","#"+gid) }catch(e){}
  subscribeGame(); renderDmbar(); render(); $("#main").scrollTop=0;
}
function toLobby(){ G.id=null; G.role="none"; subscribeGame(); try{ history.replaceState(null,"","#lobi") }catch(e){} render() }
function onGames(){
  // sahibin önceki masası: ilk açılışta DM olarak sahiplen
  if(IS_OWNER&&ME.id) for(const g of Object.values(S.games)) if(g.createdBy==="__owner__"){ g.createdBy=ME.id; g.dms=g.dms||{}; g.dms[ME.id]=true; saveGame(g,["createdBy","dms."+ME.id]) }
  resolveNames(Object.values(S.games).flatMap(g=>[...members(g),...Object.keys(g.pending||{}),g.createdBy]).filter(x=>x&&x!=="__owner__"));
  if(G.id){ const g=S.games[G.id]; if(!g){ toast("Bu oyun silindi"); toLobby(); return }
    const r=roleOf(g); if(r!==G.role){ const was=G.role; G.role=r;
      if(r!=="dm"&&r!=="player"){ toast("Bu oyundan çıkarıldın"); toLobby(); return }
      toast(r==="dm"?"Sana DM yetkisi verildi":"Artık oyuncu görünümündesin"); if(was==="dm"||r==="dm") subscribeGame(); renderDmbar() } }
  else if(pendingHash&&S.games[pendingHash]){ const h=pendingHash; pendingHash=null; const r=roleOf(S.games[h]); if(r==="dm"||r==="player"){ enterGame(h); return } }
  softRender();
}
let pendingHash=null;

async function init(){
  renderTrayStatic();
  let db=null, assets=null, user=null, room=null;
  if(window.claude && typeof window.claude.use==="function"){
    let smp; [db,assets,user,room,smp]=await Promise.all(["db","assets","user","room","sample"].map(n=>claude.use(n).catch(()=>null))); SAMPLE_FN=smp||null;
  }
  if(!db){ LOCAL=true; db=makeLocalDB() }
  DB=db; ASSETS=assets; USER=user; ROOM=room;
  if(USER){ try{ const me=await USER.me(); ME={id:me.id,color:me.color,name:me.name}; if(me.id) PROF[me.id]={name:me.name||"Sen",color:me.color} }catch(e){}
    if(!ME.id){ try{ ME.id=await USER.id() }catch(e){} }
    try{ IS_OWNER=!!(await USER.isOwner()) }catch(e){}
    USER.can("data.write").then(v=>{ if(v===false) readOnly(true) }).catch(()=>{}) }
  if(LOCAL){ ME={id:"yerel",name:"Sen",color:"#2f8f86"}; IS_OWNER=true; setSync("ok","Bu tarayıcıda") }
  else setSync("wait","Bağlanıyor");
  const h=(location.hash||"").slice(1); if(h.startsWith("g-")) pendingHash=h;
  DB.collection("games").onSnapshot(snap=>{
    for(const ch of snap.docChanges()){ const id=ch.doc.id, k="games/"+id;
      if(ch.type==="removed"){ remoteP.delete(k); if(!isDirty(k)) delete S.games[id]; continue }
      remoteP.add(k); if(isDirty(k)) continue; S.games[id]=clone(ch.doc.data()) }
    if(!snap.metadata.fromCache) S.gamesLoaded=true; setSync("ok",LOCAL?"Bu tarayıcıda":"Senkron"); onGames();
  },()=>setSync("err","Bağlantı kesildi"));
  if(ROOM){
    ROOM.onPeers(ch=>{ PEERS=[...ch.peers]; resolveNames(PEERS.map(p=>p.by).filter(Boolean)); for(const p of ch.left) for(const [tid,r] of Object.entries(remoteDrag)) if(r.peer===p.peer) delete remoteDrag[tid]; renderPeers(); drawMap(); if(!G.id) softRender() },()=>{});
    ROOM.on("drag",msg=>{ if(msg.isMe) return; const d=msg.data||{}; if(!d.id) return; if(d.end) delete remoteDrag[d.id]; else remoteDrag[d.id]={m:d.m,x:+d.x,y:+d.y,peer:msg.peer}; if(d.m===S.mapId) drawMap() },()=>{});
    ROOM.on("sfx",msg=>{ if(msg.isMe) return; const d=msg.data||{}; if(!G.id||d.g!==G.id||!d.id) return; playSfxLocal(String(d.id)); flashPad(String(d.id),msg.by) },()=>{});
    ROOM.on("ping",msg=>{ if(msg.isMe) return; const d=msg.data||{}; if(!G.id||d.m!==S.mapId) return; pings.push({x:+d.x,y:+d.y,t:performance.now(),color:peerColor(msg.by)}); animPings() },()=>{});
    PEERS=[...ROOM.peers()];
  }
  render();
}

  toast("Örnek kampanya eklendi"); render();
}

/* ================= Lobi ================= */
const ago=t=>{ if(!t) return ""; const d=(Date.now()-t)/1000; if(d<90) return "az önce"; if(d<3600) return Math.round(d/60)+" dk önce"; if(d<86400) return Math.round(d/3600)+" sa önce"; if(d<86400*30) return Math.round(d/86400)+" gün önce"; return fmtDate(t) };
function hue(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h }
function emblem(g){ const h=hue(g.id+g.name); return `<svg class="emb" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="hsl(${h} 42% 42%)"/><path d="M24 3 15 19h18zM15 19 6 34.5M33 19l9 15.5M15 19l9 26 9-26M6 13.5 15 19M42 13.5 33 19" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/><text x="24" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Alegreya SC, serif">${esc((g.name||"?").trim()[0]||"?").toLocaleUpperCase("tr")}</text></svg>` }
function gameCard(g){
  const r=roleOf(g), ms=members(g), dms=Object.entries(g.dms||{}).filter(([,v])=>v).map(([k])=>k);
  const online=PEERS.filter(p=>(p.presence||{}).g===g.id).length;

function rnd(n){const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=lim);return v%n+1}
function parseRoll(expr){
  const e=String(expr).toLowerCase().replace(/\s+/g,"").replace(/^d/,"1d");
  if(!e) throw new Error("Boş ifade");
  const re=/([+-]?)(?:(\d*)d(\d+|%)(?:(kh|kl)(\d+))?|(\d+))/gy; let m, parts=[], pos=0;
  while(pos<e.length){ re.lastIndex=pos; m=re.exec(e); if(!m||m.index!==pos||!m[0]) throw new Error("Anlaşılmadı: "+e.slice(pos)); pos=re.lastIndex;
    const sign=m[1]==="-"?-1:1;
    if(m[6]!==undefined){ parts.push({t:"k",v:sign*+m[6]}); continue }
    const n=Math.min(+(m[2]||1),100), sides=m[3]==="%"?100:+m[3]; if(!sides||sides>1000) throw new Error("Geçersiz zar");
    const rolls=Array.from({length:n},()=>rnd(sides)); let keep=rolls.map(()=>true);
    if(m[4]){ const k=Math.min(+m[5],n); const idx=rolls.map((v,i)=>[v,i]).sort((a,b)=>m[4]==="kh"?b[0]-a[0]:a[0]-b[0]).slice(0,k).map(x=>x[1]); keep=rolls.map((_,i)=>idx.includes(i)) }
    parts.push({t:"d",sign,n,sides,rolls,keep,sum:rolls.reduce((a,v,i)=>a+(keep[i]?v:0),0)});
  }
  const total=parts.reduce((a,p)=>a+(p.t==="k"?p.v:p.sign*p.sum),0);
  const detail=parts.map((p,i)=>p.t==="k"?(i?" ":"")+sgn(p.v):`${i?(p.sign<0?" − ":" + "):(p.sign<0?"−":"")}${p.n}d${p.sides}[${p.rolls.map((v,j)=>p.keep[j]?v:"~"+v).join(",")}]`).join("");
  let crit=null; const d20=parts.filter(p=>p.t==="d"&&p.sides===20);
  if(d20.length===1){ const kept=d20[0].rolls.filter((_,i)=>d20[0].keep[i]); if(kept.length===1){ if(kept[0]===20)crit="20"; else if(kept[0]===1)crit="1" } }
  return {total,detail,crit};
}
// 5e durum etkileri (SRD 5.1): karakterin kendi zarlarına avantaj, dezavantaj ya da otomatik başarısızlık. kind: atk, check, save.
const COND5={"Kör":{atk:-1,d:"Saldırılarına dezavantaj; sana yapılan saldırılara avantaj. Görmeyi gerektiren kontroller başarısız."},"Büyülenmiş":{d:"Seni büyüleyene saldıramazsın; o sana sosyal kontrollerde avantajlıdır."},"Sağır":{d:"Duymayı gerektiren kontroller başarısız."},
  "Korkmuş":{atk:-1,check:-1,d:"Korku kaynağını görürken kontrollerine ve saldırılarına dezavantaj; ona yaklaşamazsın."},"Tutulmuş":{d:"Hızın 0."},"Aciz":{d:"Eylem ve tepki yapamazsın."},"Görünmez":{atk:1,d:"Saldırılarına avantaj; sana yapılan saldırılara dezavantaj."},
  "Felçli":{fail:1,d:"Aciz; Güç ve Çeviklik kurtarmaların otomatik başarısız. 1,5 m içinden isabet eden saldırılar kritik."},"Taşlaşmış":{fail:1,d:"Aciz; Güç ve Çeviklik kurtarmaların otomatik başarısız; her hasara direnç."},
  "Zehirlenmiş":{atk:-1,check:-1,d:"Saldırılarına ve yetenek kontrollerine dezavantaj."},"Yerde":{atk:-1,d:"Saldırılarına dezavantaj; 1,5 m içinden sana yapılan saldırılara avantaj, uzaktan dezavantaj."},
  "Kısıtlanmış":{atk:-1,dexSave:-1,d:"Hızın 0; saldırılarına ve Çeviklik kurtarmalarına dezavantaj; sana yapılan saldırılara avantaj."},"Sersemlemiş":{fail:1,d:"Aciz; Güç ve Çeviklik kurtarmaların otomatik başarısız; sana yapılan saldırılara avantaj."},
  "Bilinçsiz":{fail:1,d:"Aciz ve yerde; Güç ve Çeviklik kurtarmaların otomatik başarısız. 1,5 m içinden isabet eden saldırılar kritik."}};
const EXH5=["","Yetenek kontrollerine dezavantaj","Hızın yarıya iner","Saldırılarına ve kurtarmalarına dezavantaj","Azami canın yarıya iner","Hızın 0","Ölüm"];
function condRoll(c,kind,ab){
  const adv=[],dis=[]; let fail=null;
  (c?.conditions||[]).forEach(n=>{ const e=COND5[n]; if(!e) return;
    if(kind==="atk"&&e.atk) (e.atk>0?adv:dis).push(n);
    if(kind==="check"&&e.check) dis.push(n);

    if(kind==="save"&&e.fail&&(ab==="str"||ab==="dex")) fail=fail||n; });

function derive(c){
  const pb=profB(c.level); const m={}; ABS.forEach(([k])=>m[k]=mod(c.ab?.[k]));
  const sk={}; SKILLS.forEach(([k,,ab])=>sk[k]=m[ab]+(c.skills?.[k]||0)*pb);
  const sv={}; ABS.forEach(([k])=>sv[k]=m[k]+(c.saves?.[k]?pb:0));
  return {pb,m,sk,sv,init:m.dex+(+c.initBonus||0),pp:10+sk.perception,sdc:c.spellAb?8+pb+m[c.spellAb]:null,satk:c.spellAb?pb+m[c.spellAb]:null};
}
function updateDerived(){ if(xsys()){ if(S.view==="karakterler"&&S.chars[S.charId]) xsys().updateDerived?.(S.chars[S.charId]); return } if(S.view==="karakterler"&&sysKey()==="coc7"){ const c=S.chars[S.charId]; if(c){ const old=c.hpMax; cocUpdateDerived(c); if(old!==c.hpMax&&canEditChar(c)) save("chars",c,["hpMax"]) } return } if(sysKey()!=="dnd5e") return;
  const c=S.chars[S.charId]; if(!c||S.view!=="karakterler") return; const d=derive(c);
  $$("[data-d]",$("#main")).forEach(el=>{ const k=el.dataset.d; let v;
    if(k==="prof")v=sgn(d.pb); else if(k==="pp")v=d.pp; else if(k==="init")v=sgn(d.init);
    else if(k==="sdc")v=d.sdc??"—"; else if(k==="satk")v=d.satk==null?"—":sgn(d.satk);
    else if(k.startsWith("mod."))v=sgn(d.m[k.slice(4)]); else if(k.startsWith("save."))v=sgn(d.sv[k.slice(5)]); else if(k.startsWith("skill."))v=sgn(d.sk[k.slice(6)]);
    else if(k==="hpbar"){ const p=Math.max(0,Math.min(100,(+c.hp||0)/Math.max(1,+c.hpMax||1)*100)); el.style.width=p+"%"; el.className=p<=25?"low":p<=50?"mid":""; return }
    el.textContent=v; });
}

const imgCache={};
function getImg(url){ if(!url) return null; if(!imgCache[url]){ const im=new Image(); im.onload=()=>drawMap(); im.src=url; imgCache[url]=im } return imgCache[url].complete&&imgCache[url].naturalWidth?imgCache[url]:null }
let MV={};
function cs(){ return Math.round(36*S.zoom) }
function setupMap(){
  const m=curMap(); const cv=$("#mapc"); if(!m||!cv) return;
  const s=cs(), dpr=window.devicePixelRatio||1;
  cv.width=m.cols*s*dpr; cv.height=m.rows*s*dpr; cv.style.width=m.cols*s+"px"; cv.style.height=m.rows*s+"px";
  MV={cv,ctx:cv.getContext("2d"),dpr,drag:null,meas:null,rect:null,op:null,ldrag:null};
  cv.addEventListener("pointerleave",()=>presenceCursor(null));
  drawMap();
  cv.addEventListener("pointerdown",mapDown); cv.addEventListener("pointermove",mapMove); cv.addEventListener("pointerup",mapUp); cv.addEventListener("pointercancel",mapUp);
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() }
function drawTerrain(ctx,v,X,Y,s,col,im){
  const sk=window.PROPS&&getImg(PROPS.skin(v)); if(sk){ ctx.globalAlpha=1; ctx.drawImage(sk,X,Y,s,s); return } // kullanıcının kendi arazi resmi
  ctx.globalAlpha=im?(v==="wall"||v==="pit"?.9:.65):1;
  switch(v){
    case "wall": ctx.fillStyle=col.wall; ctx.fillRect(X,Y,s,s); break;
    case "door": ctx.fillStyle=col.door; ctx.fillRect(X,Y,s,s); ctx.fillStyle=col.floor; ctx.fillRect(X+s*.18,Y+s*.42,s*.64,s*.16); break;
    case "water": ctx.fillStyle=col.water; ctx.fillRect(X,Y,s,s); ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=1.2; ctx.beginPath(); for(const f of [.35,.7]){ ctx.moveTo(X+s*.12,Y+s*f); ctx.quadraticCurveTo(X+s*.32,Y+s*(f-.12),X+s*.5,Y+s*f); ctx.quadraticCurveTo(X+s*.68,Y+s*(f+.12),X+s*.88,Y+s*f) } ctx.stroke(); break;
    case "rough": ctx.fillStyle=col.rough; ctx.globalAlpha*=.85; ctx.fillRect(X,Y,s,s); ctx.globalAlpha=.45; ctx.strokeStyle=col.ink; ctx.lineWidth=1; ctx.save(); ctx.beginPath(); ctx.rect(X,Y,s,s); ctx.clip(); ctx.beginPath(); for(let i=-s;i<s;i+=8){ctx.moveTo(X+i,Y+s);ctx.lineTo(X+i+s,Y)} ctx.stroke(); ctx.restore(); break;
    case "tree": ctx.fillStyle=col.tree; ctx.beginPath(); ctx.arc(X+s/2,Y+s/2,s*.44,0,7); ctx.fill(); ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.arc(X+s*.6,Y+s*.6,s*.2,0,7); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.18)"; ctx.beginPath(); ctx.arc(X+s*.38,Y+s*.36,s*.13,0,7); ctx.fill(); break;
    case "pit": ctx.fillStyle=col.pit; ctx.fillRect(X+2,Y+2,s-4,s-4); ctx.strokeStyle=col.wall; ctx.lineWidth=2; ctx.strokeRect(X+3,Y+3,s-6,s-6); break;
    case "lava": ctx.fillStyle=col.lava; ctx.fillRect(X,Y,s,s); ctx.fillStyle="rgba(255,214,90,.6)"; ctx.beginPath(); ctx.arc(X+s*.3,Y+s*.34,s*.1,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(X+s*.68,Y+s*.66,s*.08,0,7); ctx.fill(); break;
    case "stairs": ctx.fillStyle=col.stairs; ctx.fillRect(X,Y,s,s); ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=1.5; ctx.beginPath(); for(let i=1;i<5;i++){ ctx.moveTo(X,Y+s*i/5); ctx.lineTo(X+s,Y+s*i/5) } ctx.stroke(); break;
    case "trap": ctx.globalAlpha=1; ctx.strokeStyle=col.trap; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(X+s*.28,Y+s*.28); ctx.lineTo(X+s*.72,Y+s*.72); ctx.moveTo(X+s*.72,Y+s*.28); ctx.lineTo(X+s*.28,Y+s*.72); ctx.stroke(); ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.strokeRect(X+s*.12,Y+s*.12,s*.76,s*.76); ctx.setLineDash([]); break;
  }
  ctx.globalAlpha=1;
}
function activeTokenIds(){
  const cb=S.combat.current, out=new Set(); if(!cb||!cb.started||!cb.active) return out;
  const e=cb.entries&&cb.entries[cb.active]; if(!e||e.removed) return out; if(e.hidden&&!isDM()) return out;
  if(e.tokenId) out.add(e.tokenId);
  if(e.kind==="char") for(const m of Object.values(S.maps)) for(const t of toks(m)) if(t.charId===e.ref) out.add(t.id);
  return out;
}
function rectCells(a,b,room){ const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y),out=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(!room||x===x0||x===x1||y===y0||y===y1) out.push([x,y]); return out }

  // etiketler

  for(const l of visLabs(m)){ const dr=MV.ldrag&&MV.ldrag.id===l.id?MV.ldrag:null; const x=dr?dr.x:l.x, y=dr?dr.y:l.y;
    ctx.font=`700 ${Math.max(11,Math.round(s*.38))}px ${cssVar("--f-display")}`; ctx.lineWidth=4; ctx.strokeStyle=col.floor; ctx.strokeText(l.text||"",(x+.5)*s,(y+.5)*s); ctx.fillStyle=col.ink; ctx.fillText(l.text||"",(x+.5)*s,(y+.5)*s);
    if(l.id===S.selLab){ const w=ctx.measureText(l.text||"").width+10; ctx.strokeStyle=cssVar("--gold"); ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.strokeRect((x+.5)*s-w/2,(y+.5)*s-s*.35,w,s*.7); ctx.setLineDash([]) } }

  for(const t of toks(m)){ const hid=tokFogged(m,t); if((hid||(window.LIGHT&&LIGHT.tokHidden(m,t)))&&!dm) continue;
    const dr=MV.drag&&MV.drag.id===t.id?MV.drag:null; const sz=+t.size||1; const rd=!dr&&remoteDrag[t.id]&&remoteDrag[t.id].m===m.id?remoteDrag[t.id]:null;
    const px=dr?dr.px:rd?(rd.x+sz/2)*s:(t.x+sz/2)*s, py=dr?dr.py:rd?(rd.y+sz/2)*s:(t.y+sz/2)*s, r=sz*s/2-3;
    if(!dm&&window.LIGHT&&LIGHT.tokSil(m,t)){ LIGHT.drawSil(ctx,px,py,r); continue } // karanlıkta yalnızca belirsiz gölge
    if(act.has(t.id)){ ctx.globalAlpha=1; ctx.strokeStyle=cssVar("--gold"); ctx.lineWidth=3; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(px,py,r+5,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]) }
    ctx.globalAlpha=rd?.75:hid?.55:1; ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fillStyle=t.color||"#555"; ctx.fill();

    let p=null; if(t.charId&&S.chars[t.charId]){ const H=charHp(S.chars[t.charId]); p=pct(H.hp,H.max)/100 } else if(dm&&t.hpMax!==undefined&&t.hpMax!==""&&t.hpMax!==null) p=pct(t.hp,t.hpMax)/100;

function cellAt(e){ const r=MV.cv.getBoundingClientRect(), s=cs(); return {x:Math.floor((e.clientX-r.left)/s),y:Math.floor((e.clientY-r.top)/s),px:e.clientX-r.left,py:e.clientY-r.top} }
function tokAt(m,c){ return [...visToks(m)].reverse().find(t=>{const z=+t.size||1;return c.x>=t.x&&c.x<t.x+z&&c.y>=t.y&&c.y<t.y+z}) }

/* düzenleme geçmişi: geri al / yinele */
const HIST={};
function hist(m){ return HIST[m.id]||(HIST[m.id]={u:[],r:[]}) }
function pushHist(m,op){ const h=hist(m); h.u.push(clone(op)); if(h.u.length>80) h.u.shift(); h.r=[] }
function applyOp(m,op,dir){ const paths=[];
  for(const [f,kv] of Object.entries(op)){ m[f]=m[f]||{};
    for(const [k,pair] of Object.entries(kv)){ const v=dir<0?pair[0]:pair[1];
      if(f==="labels"){ if(v===null){ if(m.labels[k]){ m.labels[k].removed=true; paths.push("labels."+k+".removed") } } else { m.labels[k]=clone(v); paths.push("labels."+k) } }
      else { m[f][k]=v; paths.push(f+"."+k) } } }
  if(paths.length) save("maps",m,paths) }
function undo(dir){ const m=curMap(); if(!m||S.ro) return; const h=hist(m); const op=(dir<0?h.u:h.r).pop(); if(!op){ toast(dir<0?"Geri alınacak değişiklik yok":"Yinelenecek değişiklik yok"); return } applyOp(m,op,dir); (dir<0?h.r:h.u).push(op); render() }
function commitOp(m){ const op=MV.op; MV.op=null; if(!op) return; const paths=[]; for(const [f,kv] of Object.entries(op)) for(const k of Object.keys(kv)) paths.push(f+"."+k); if(paths.length){ pushHist(m,op); save("maps",m,paths) } }
function applyCell(m,x,y){ if(x<0||y<0||x>=m.cols||y>=m.rows) return; const k=x+","+y; let f,v;
  if(S.tool==="paint"){f="cells";v=S.terrain} else if(S.tool==="props"){f="props";v=S.prop||""} else if(S.tool==="erase"){f="cells";v=""} else if(S.tool==="fogshow"){f="fog";v=1} else if(S.tool==="foghide"){f="fog";v=0} else return;
  m[f]=m[f]||{}; const old=m[f][k]??(f==="fog"?0:""); if(old===v) return;
  MV.op=MV.op||{}; MV.op[f]=MV.op[f]||{}; if(!(k in MV.op[f])) MV.op[f][k]=[old,v]; else MV.op[f][k][1]=v; m[f][k]=v }
function bulkOp(m,f,fn){ MV.op={}; MV.op[f]={}; m[f]=m[f]||{}; for(let y=0;y<m.rows;y++)for(let x=0;x<m.cols;x++){ const k=x+","+y; const old=m[f][k]??(f==="fog"?0:""), v=fn(old); if(v!==old){ MV.op[f][k]=[old,v]; m[f][k]=v } } commitOp(m) }

function mapDown(e){
  const m=curMap(); if(!m||S.tool==="pan") return; const c=cellAt(e); MV.cv.setPointerCapture(e.pointerId);
  if(S.tool==="move"){
    const t=tokAt(m,c);
    if(t){ S.selTok=t.id; S.selLab=null; if(S.ro||!ownsTok(t)){ render(); return } MV.drag={id:t.id,px:c.px,py:c.py,moved:false}; S.dragging=true; drawMap(); return }
    const l=labAt(m,c);
    if(l){ S.selLab=l.id; S.selTok=null; if(S.ro||!isDM()){ render(); return } MV.ldrag={id:l.id,x:l.x,y:l.y,moved:false}; S.dragging=true; drawMap(); return }
    if(S.selTok||S.selLab){ S.selTok=null; S.selLab=null; render() } return }
  if(S.tool==="measure"){ MV.meas={a:c,b:c}; S.dragging=true; drawMap(); return }
  if(S.tool==="ping"){ pings.push({x:c.x,y:c.y,t:performance.now(),color:ME.color||cssVar("--gold")}); animPings(); if(ROOM) ROOM.emit("ping",{m:m.id,x:c.x,y:c.y}).catch(()=>toast("İşaret gönderilemedi")); return }
  if(S.ro){ toast("Bu masada yalnızca görüntüleme iznin var"); return }
  if(!isDM()){ S.tool="move"; render(); return }
  if(S.tool==="label"){ const l={id:uid("lb"),x:c.x,y:c.y,text:"Yeni etiket",removed:false}; m.labels=m.labels||{}; m.labels[l.id]=l; S.selLab=l.id; S.selTok=null;
    pushHist(m,{labels:{[l.id]:[null,clone(l)]}}); save("maps",m,["labels."+l.id]); S.tool="move"; render(); setTimeout(()=>{const i=$('[data-lk="text"]'); if(i){i.focus();i.select()}},0); return }
  if((S.tool==="fogshow"||S.tool==="foghide")&&!m.fogOn){ m.fogOn=true; save("maps",m,["fogOn"]); toast("Sis açıldı. Oyunculara göstermek istediğin alanları aç.") }
  S.dragging=true;
  if(S.shape==="brush"){ MV.painting=true; MV.op={}; applyCell(m,c.x,c.y); drawMap() }
  else { MV.rect={a:c,b:c}; drawMap() }
}
function mapMove(e){
  const m=curMap(); if(!m) return; const c=cellAt(e);
  presenceCursor([+(c.px/cs()).toFixed(2),+(c.py/cs()).toFixed(2)]);
  if(MV.drag){ MV.drag.px=c.px; MV.drag.py=c.py; MV.drag.moved=true; const t=m.tokens[MV.drag.id], sz=+t.size||1; emitDrag({m:m.id,id:t.id,x:+(c.px/cs()-sz/2).toFixed(2),y:+(c.py/cs()-sz/2).toFixed(2)}); drawMap(); return }
  if(MV.ldrag){ const x=Math.max(0,Math.min(m.cols-1,c.x)), y=Math.max(0,Math.min(m.rows-1,c.y)); if(x!==MV.ldrag.x||y!==MV.ldrag.y){ MV.ldrag.x=x; MV.ldrag.y=y; MV.ldrag.moved=true; drawMap() } return }
  if(MV.meas){ MV.meas.b=c; const ft=Math.max(Math.abs(MV.meas.a.x-c.x),Math.abs(MV.meas.a.y-c.y))*5; $("#measure").textContent=`Mesafe: ${ft} ft (${(ft*0.3).toLocaleString("tr-TR",{maximumFractionDigits:1})} m) · ${ft/5} kare`; drawMap(); return }
  if(MV.rect){ const b={x:Math.max(0,Math.min(m.cols-1,c.x)),y:Math.max(0,Math.min(m.rows-1,c.y))}; if(b.x!==MV.rect.b.x||b.y!==MV.rect.b.y){ MV.rect.b=b; drawMap() } return }
  if(MV.painting){ applyCell(m,c.x,c.y); drawMap() }
}
function mapUp(e){
  const m=curMap(); if(!m) return;
  if(MV.drag){ const t=m.tokens[MV.drag.id]; const sz=+t.size||1, s=cs();
    if(MV.drag.moved){ t.x=Math.max(0,Math.min(m.cols-sz,Math.round(MV.drag.px/s-sz/2))); t.y=Math.max(0,Math.min(m.rows-sz,Math.round(MV.drag.py/s-sz/2))); save("maps",m,["tokens."+t.id+".x","tokens."+t.id+".y"]) }
    emitDrag({m:m.id,id:t.id,end:true},true); MV.drag=null; S.dragging=false; render(); return }
  if(MV.ldrag){ const l=m.labels[MV.ldrag.id]; if(MV.ldrag.moved&&l){ l.x=MV.ldrag.x; l.y=MV.ldrag.y; save("maps",m,["labels."+l.id+".x","labels."+l.id+".y"]) } MV.ldrag=null; S.dragging=false; render(); return }
  if(MV.meas){ MV.meas=null; S.dragging=false; drawMap(); return }
  if(MV.rect){ const {a,b}=MV.rect; MV.rect=null; MV.op={}; for(const [x,y] of rectCells(a,b,S.shape==="room")) applyCell(m,x,y); commitOp(m); S.dragging=false; render(); return }
  if(MV.painting){ MV.painting=false; S.dragging=false; commitOp(m); if(staleWhileEditing){staleWhileEditing=false;render()} else drawMap() }
}

/* ---------- Savaş: inisiyatif ---------- */
function combat(){ return S.combat.current||{id:"current",round:1,active:null,started:false,entries:{}} }
function cEntries(cb){ const up=sysKey()==="yze"?-1:1; return Object.values(cb.entries||{}).filter(e=>e&&!e.removed).sort((a,b)=>up*((+b.init||0)-(+a.init||0))||(+b.dex||0)-(+a.dex||0)||String(a.name).localeCompare(String(b.name),"tr")) }

function entryName(e){ return e.hidden&&!isDM()?"DM":e.name }
let lastTurnKey=null;
function announceTurn(){
  const cb=S.combat.current; if(!cb||!cb.started||!cb.active){ lastTurnKey=null; renderTurnbar(); return }
  const key=cb.round+"/"+cb.active; if(lastTurnKey&&key!==lastTurnKey){ const e=cb.entries[cb.active]; if(e) toast(`Tur ${cb.round} · Sıra ${e.hidden&&!isDM()?"DM'de":e.name+"'da"}`) }
  lastTurnKey=key; renderTurnbar();
}
function renderTurnbar(){
  const el=$("#turnbar"); if(!el) return; const cb=S.combat.current;
  if(!cb||!cb.started||!cb.active||!cb.entries[cb.active]){ el.hidden=true; return }
  const e=cb.entries[cb.active]; el.hidden=false;
  el.innerHTML=`<span>Tur <b class="num">${cb.round}</b> · Sıra: <b>${esc(entryName(e))}</b></span>${S.ro||!(isDM()||myTurn())?"":`<button class="btn sm pri" data-tb="next">${isDM()?"Sonraki":"Turumu bitir"}</button>`}`;
}
function myTurn(){ const cb=S.combat.current; if(!cb||!cb.started||!cb.active) return false; const e=cb.entries&&cb.entries[cb.active]; return !!(e&&e.kind==="char"&&S.chars[e.ref]?.owner===ME.id) }
function stepTurn(dir){
  if(!isDM()&&!(dir>0&&myTurn())){ toast("Sırayı DM ya da sırası gelen oyuncu ilerletebilir"); return }
  const cb=combat(); const list=cEntries(cb); if(!list.length) return; let i=list.findIndex(e=>e.id===cb.active);
  if(i<0){ cb.active=list[0].id } else { i+=dir; if(i>=list.length){ i=0; cb.round=(+cb.round||1)+1 } else if(i<0){ i=list.length-1; cb.round=Math.max(1,(+cb.round||1)-1) } cb.active=list[i].id }
  saveCombat(cb,["active","round"]); announceTurn(); if(S.view==="savas") render(); else drawMap();
}
function initRow(e,cb,dm){
  let hp="", sub="";
  if(e.kind==="char"&&S.chars[e.ref]){ const c=S.chars[e.ref]; const H=charHp(c); const p=pct(H.hp,H.max); hp=`<span class="ihp"><i class="${p<=25?"low":p<=50?"mid":""}" style="width:${p}%"></i></span><span class="num ihpn">${esc(H.hp)}/${esc(H.max)}</span>`; sub=sysKey()==="dnd5e"?[`ZS ${c.ac}`,...(c.conditions||[])].join(" · "):sysKey()==="coc7"?[`SAN ${c.san}`,...COC_STATUS.filter(x=>c.status?.[x[0]]).map(x=>x[1])].join(" · "):(c.conds||[]).join(" · ") }
  else if(e.tokenId){ const t=findTok(e.tokenId); if(t&&t.hpMax!==undefined&&t.hpMax!==""&&t.hpMax!==null){ if(dm){ const p=pct(t.hp,t.hpMax); hp=`<span class="ihp"><i class="${p<=25?"low":p<=50?"mid":""}" style="width:${p}%"></i></span><span class="num ihpn">${esc(t.hp)}/${esc(t.hpMax)}</span>` } else hp=`<span class="ihps">${hpStatus(t.hp,t.hpMax)}</span>` }
    const mo=t&&t.monsterId&&S.monsters[t.monsterId]; if(dm&&mo) sub=`ZS ${mo.ac}` }
  const on=cb.started&&cb.active===e.id; const mineE=e.kind==="char"&&S.chars[e.ref]?.owner===ME.id; const can=dm||mineE;
  return `<li class="irow ${on?"on":""} ${e.hidden?"hid":""}"><input class="f num iinit" type="number" data-ce="${e.id}" value="${esc(e.init)}" aria-label="${esc(e.name)} inisiyatifi" ${S.ro||!can?"disabled":""}>
    <div class="iname"><b>${esc(e.name)}${on?' <span class="nowtag">Sırada</span>':""}</b><small>${esc(sub)}${e.hidden?(sub?" · ":"")+"oyunculardan gizli":""}</small><div class="ihpwrap">${hp}</div></div>
    <span class="iact">${S.ro?"":`${dm?`<button class="btn sm" data-act="chide" data-id="${e.id}" title="Oyunculardan gizle ya da göster">${e.hidden?"Göster":"Gizle"}</button>`:""}${dm&&cb.started&&!on?`<button class="btn sm" data-act="cset" data-id="${e.id}" title="Sırayı buraya al">Sıra</button>`:""}${can?`<button class="btn sm danger" data-act="crm" data-id="${e.id}" aria-label="${esc(e.name)} sıradan çıkar">×</button>`:""}`}</span></li>`;

function cocDerive(c){
  const ch=c.ch||{}, n=k=>+ch[k]||0;
  const hpMax=Math.floor((n("con")+n("siz"))/10), mpMax=Math.floor(n("pow")/5);

  if(ss>=65&&ss<=84){db="−1";build=-1} else if(ss>=85&&ss<=124){db="0";build=0} else if(ss>=125&&ss<=164){db="+1d4";build=1} else if(ss>=165&&ss<=204){db="+1d6";build=2} else if(ss>=205){ const k=Math.floor((ss-205)/80); db="+"+(2+k)+"d6"; build=3+k }
  let mov=n("dex")<n("siz")&&n("str")<n("siz")?7:(n("dex")>n("siz")&&n("str")>n("siz")?9:8);

  return {hpMax,mpMax,db,build,mov,sanMax,dodge:Math.floor(n("dex")/2)};
}

function cocRoll(target,label,secret,mod=S.cocMod||0,pushed=false){
  target=Math.max(0,+target||0); const u=rnd(10)-1; const tens=Array.from({length:1+Math.abs(mod)},()=>rnd(10)-1);
  const vals=tens.map(t=>{ const v=t*10+u; return v===0?100:v }); const pick=mod>0?Math.min(...vals):mod<0?Math.max(...vals):vals[0];
  const fum=target<50?pick>=96:pick===100;
  const lv=pick===1?"crit":fum?"fumble":pick<=Math.floor(target/5)?"ext":pick<=Math.floor(target/2)?"hard":pick<=target?"reg":"fail";
  const e={id:uid("l"),t:Date.now(),label:label+(pushed?" (zorlanmış)":""),expr:`d100 ≤ ${target}${mod?` · ${mod>0?"bonus":"ceza"} ${Math.abs(mod)}`:""}`,total:pick,

    lv,secret:!!(isDM()&&(S.secret||secret))};
  pushRoll(e); S.lastCoc=lv==="fail"&&!pushed?{target,label,secret,mod}:null; renderTrayCoc(); return e;
}

/* YZE zar havuzu: 6 = başarı; temel/ekipman/stres zarlarındaki 1'ler zorlamada bedel */
const YZ={base:2,skill:1,gear:0,stress:0,mod:0,label:"Zar havuzu"};
function rollN(n){ return Array.from({length:Math.max(0,Math.min(30,+n||0))},()=>rnd(6)) }
function yzeTally(r){ const all=[...r.base,...r.skill,...r.gear,...r.stress]; return {succ:Math.max(0,all.filter(v=>v===6).length-(r.neg||[]).filter(v=>v===6).length),negS:(r.neg||[]).filter(v=>v===6).length,baneB:r.base.filter(v=>v===1).length,baneG:r.gear.filter(v=>v===1).length,baneS:r.stress.filter(v=>v===1).length} }
// Değiştirici beceri zarı ekler ya da çıkarır; beceri zarı sıfırın altına inerse kalan kadar eksi zar atılır, eksi zardaki her 6 bir başarıyı siler.
function yzeRoll(base,skill,gear,stress,label,secret,mod=YZ.mod||0){
  const sk=(+skill||0)+(+mod||0);
  const r={base:rollN(base),skill:rollN(Math.max(0,sk)),gear:rollN(gear),stress:rollN(stress),neg:rollN(Math.max(0,-sk))};
  return yzeLog(r,label,false,secret);
}
function yzeLog(r,label,pushed,secret){
  const t=yzeTally(r); const f=a=>a.length?`[${a.join(",")}]`:"";
  const e={id:uid("l"),t:Date.now(),label:label+(pushed?" (zorlandı)":""),expr:`${r.base.length}T ${r.skill.length}B ${r.gear.length}E${r.stress.length?` ${r.stress.length}S`:""}${r.neg?.length?` ${r.neg.length}Eksi`:""}`,total:t.succ,
    detail:`${t.succ} başarı${pushed&&(t.baneB||t.baneG)?` · bedel: ${t.baneB?t.baneB+" özellik hasarı":""}${t.baneB&&t.baneG?", ":""}${t.baneG?t.baneG+" ekipman hasarı":""}`:""}${t.baneS?` · stres zarında ${t.baneS} tane 1: panik!`:""}${t.negS?` · eksi zarlar ${t.negS} başarı sildi`:""} · T${f(r.base)} B${f(r.skill)} E${f(r.gear)}${r.stress.length?" S"+f(r.stress):""}${r.neg?.length?" Eksi"+f(r.neg):""}`,
    crit:t.succ>=2?"20":t.succ===0&&(t.baneS)?"1":null,yz:r,secret:!!(isDM()&&(S.secret||secret))};

}

    case "cocmon-ch": { const k=b.dataset.ch; cocRoll(mo.ch?.[k],`${mo.name} · ${k.toUpperCase()}`,true); return true }
    case "cocmon-atk": { const at=mo.attacks[+b.dataset.i]; cocRoll(at.pct,`${mo.name} · ${at.name||"Saldırı"}`,true); return true }
    case "yze-preset": { const key=$("#yzePreset").value; armed(b,()=>{ yzeApplyPreset(c,key); save("chars",c,["preset","attrs","skills","useStress"]); render(); toast("Şablon uygulandı") }); return true }

    case "yze-attr": { const at=c.attrs[+b.dataset.i], cm=yzeCondMod(c,+b.dataset.i); YZ.ctx={charId:c.id,attr:+b.dataset.i}; YZ.base=+at.cur||0; YZ.skill=0; YZ.label=`${nm} · ${at.name}`; yzeRoll(YZ.base,0,YZ.gear,YZ.stress,YZ.label+(cm.why.length?` (${cm.why.join(", ")}: ${sgn(cm.mod)})`:""),false,(YZ.mod||0)+cm.mod); return true }

    case "yze-addskill": (c.skills=c.skills||[]).push({name:"Yeni beceri",attr:0,val:0}); save("chars",c,["skills"]); render(); return true;
    case "yze-cond": { const x=b.dataset.c; c.conds=c.conds||[]; c.conds=c.conds.includes(x)?c.conds.filter(y=>y!==x):[...c.conds,x]; save("chars",c,["conds"]); render(); return true }

function inRange(v,s){ const m=String(s||"").match(/^\s*(\d)\s*(?:[-–]\s*(\d))?\s*$/); if(!m) return false; const a=+m[1], b2=m[2]?+m[2]:a; return v>=a&&v<=b2 }
function yzeMonRow(mo,row,r){ if(!row){ pushRoll({id:uid("l"),t:Date.now(),label:`${mo.name} · saldırı tablosu`,expr:"d6",total:r,detail:"Bu sonuç için satır yok",crit:null,secret:isDM()}); return }
  const res=+row.dice?yzeTally({base:rollN(+row.dice),skill:[],gear:[],stress:[]}).succ:null;
  pushRoll({id:uid("l"),t:Date.now(),label:`${mo.name} · ${row.name}`,expr:r?`d6 = ${r}`:"seçili satır",total:res??r??"—",detail:`${row.desc||""}${res!=null?` · ${row.dice} zar → ${res} başarı`:""}${row.dmg?` · hasar ${row.dmg}`:""}`,crit:null,secret:isDM()}) }
function cocDmgExpr(s,db,ext){ let t=String(s||"").replace(/\bDB\b/gi,db==="0"||db==="−1"||db==="−2"?"":db.replace("−","-")).replace(/\s+/g,""); const ex=dmgExpr(t,false); if(!ex) return null; if(!ext) return ex;
  const max=ex.replace(/(\d*)d(\d+)/g,(_,n,sd)=>String((+n||1)*+sd)); return max+"+"+ex }

      for(const t of toks(m)){ if(t.charId||have.has(t.id)) continue; const mm=t.monsterId&&S.monsters[t.monsterId]; const ir=initForMon(mm,cb); const en={id:uid("e"),name:t.label,init:ir.init,dex:ir.dex,kind:"monster",tokenId:t.id,hidden:tokFogged(m,t),removed:false}; cb.entries[en.id]=en; paths.push("entries."+en.id); res.push(`${t.label} ${en.init}`) }

function atkBonus(s){ return parseInt(String(s||"").replace(/\s/g,""))||0 }
// Hasar zarı ile hasar türü ayrı tutulur. Eski kayıtlardaki "1d8+3 delici" gibi birleşik metin de okunur: zar ifadesi baştan alınır, kalanı tür olur.
const DICE_RE=/^\s*((?:\d*d\d+(?:k[hl]\d+)?|\d+)(?:\s*[+\-]\s*(?:\d*d\d+(?:k[hl]\d+)?|\d+))*)/i;
function splitDmg(a){ const s=String(a?.dmg||""), mm=s.match(DICE_RE); const dice=mm?mm[1].replace(/\s+/g,""):""; return {dice:dice||s.trim(),type:String(a?.type||"").trim()||(dice?s.slice(mm[0].length).trim():"")} }
// Direnç, zayıflık ve bağışıklık: hedefli saldırılarda hasar bunlara göre hesaplanır (web/ext/saldiri.js).
function resPanel(c,pf){ const I=(k,n,ph)=>`<label><span class="lbl">${n}</span><input class="f" data-k="${k}" value="${esc(c[k]||"")}" placeholder="${ph}" list="dmgTypes" aria-label="${n}"></label>`;
  return `<div class="panel"><h3>Direnç ve zayıflık</h3><div class="resg">${I("res","Direnç",pf?"ateş 5":"ateş")}${I("vuln","Zayıflık",pf?"gümüş 5":"soğuk")}${I("immun","Bağışıklık","zehir")}</div><p class="hint">Birden fazlasını virgülle ayır${pf?"; direnç ve zayıflıkta miktarı yaz":""}. Savaşta hedef seçerek yapılan saldırılar hasarı buna göre işler.</p></div>` }
function dmgInputs(attr,i,a,ph){ const d=splitDmg(a); return `<span class="dmgf dmgw"><input class="f" ${attr}="attacks.${i}.dmg" value="${esc(d.dice)}" placeholder="${ph}" aria-label="Hasar zarı"><input class="f dtype" ${attr}="attacks.${i}.type" value="${esc(d.type)}" placeholder="Tür" list="dmgTypes" aria-label="Hasar türü"></span>` }
function dmgExpr(s,crit){ const mm=String(s||"").match(DICE_RE); if(!mm||!/d/i.test(mm[1])) return null; let ex=mm[1].replace(/\s+/g,""); if(crit) ex=ex.replace(/(\d*)d(\d+)/g,(_,n,s2)=>((+n||1)*2)+"d"+s2); return ex }
function freeCell(m){ for(let y=0;y<m.rows;y++)for(let x=0;x<m.cols;x++){ if(!toks(m).some(t=>{const z=+t.size||1;return x>=t.x&&x<t.x+z&&y>=t.y&&y<t.y+z})&&!["wall","pit","water","lava","tree"].includes(m.cells[x+","+y])&&!(window.PROPS&&PROPS.solid(m.props?.[x+","+y]))) return {x,y} } return {x:0,y:0} }

/* ---------- Oyun ayarları olayları ---------- */
main.addEventListener("input",e=>{ const el=e.target; if(!el.dataset.gk) return; const g=S.games[G.id]; if(!g||G.role!=="dm") return;
  const k=el.dataset.gk; g[k]=el.type==="checkbox"?el.checked:el.value; saveGame(g,[k]); if(k==="name") $("#gname").textContent=g.name });
main.addEventListener("change",e=>{ const el=e.target; if(el.dataset.gm!=="char") return; const g=S.games[G.id]; if(!g||G.role!=="dm") return; const id=el.dataset.id, cid=el.value||null;
  const prev=g.players?.[id]?.charId; if(prev&&S.chars[prev]&&S.chars[prev].owner===id){ S.chars[prev].owner=null; save("chars",S.chars[prev],["owner"]) }
  g.players[id]={...(g.players[id]||{joined:Date.now()}),charId:cid}; saveGame(g,["players."+id+".charId"]);
  if(cid&&S.chars[cid]){ S.chars[cid].owner=id; save("chars",S.chars[cid],["owner"]) } toast(cid?`${S.chars[cid].name} → ${nameOf(id)}`:"Karakter bağlantısı kaldırıldı"); render() });
main.addEventListener("click",e=>{ const b=e.target.closest("[data-gm]"); if(!b||b.tagName==="SELECT") return; const g=S.games[G.id]; if(!g) return; const a=b.dataset.gm, id=b.dataset.id;
  const dmOnly=["mkdm","undm","kick","accept","reject","delete"]; if(dmOnly.includes(a)&&G.role!=="dm") return;
  g.dms=g.dms||{}; g.players=g.players||{}; g.pending=g.pending||{};
  switch(a){
    case "mkdm": g.dms[id]=true; saveGame(g,["dms."+id]); toast(`${nameOf(id)} artık DM`); break;
    case "undm": if(Object.values(g.dms).filter(Boolean).length<2){ toast("Oyunda en az bir DM kalmalı"); return } g.dms[id]=false; if(!g.players[id]) g.players[id]={joined:Date.now(),charId:null}; saveGame(g,["dms."+id,"players."+id]); toast(`${nameOf(id)} oyuncu oldu`); break;
    case "kick": armed(b,()=>{ g.dms[id]=false; g.players[id]=null; saveGame(g,["dms."+id,"players."+id]); for(const c of Object.values(S.chars)) if(c.owner===id){ c.owner=null; save("chars",c,["owner"]) } toast(`${nameOf(id)} oyundan çıkarıldı`); render() }); return;
    case "accept": g.pending[id]=null; g.players[id]={joined:Date.now(),charId:null}; saveGame(g,["pending."+id,"players."+id]); toast(`${nameOf(id)} oyuna katıldı`); break;
    case "reject": g.pending[id]=null; saveGame(g,["pending."+id]); break;
    case "leave": armed(b,()=>{ g.players[ME.id]=null; saveGame(g,["players."+ME.id]); for(const c of Object.values(S.chars)) if(c.owner===ME.id){ c.owner=null; save("chars",c,["owner"]) } toLobby(); toast("Oyundan ayrıldın") }); return;
    case "delete": if(g.createdBy!==ME.id) return; armed(b,()=>{ for(const col of COLS) for(const k of Object.keys(S[col])) del(col,k); clearRolls(); const ref=DB.collection("games").doc(g.id); delete S.games[g.id]; persistRef(ref,null,null); toLobby(); toast("Oyun silindi") }); return;
  }
  render();
});

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLibP=null, PDFDOC=null, scCtl=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Betik yüklenemedi")); document.head.appendChild(s) }) }
function ensurePdfLib(){ return pdfLibP||(pdfLibP=(async()=>{ await loadScript(PDFJS+"pdf.min.js"); await loadScript(PDFJS+"pdf.worker.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; return window.pdfjsLib })()) }
async function openPdfData(buf){ const lib=await ensurePdfLib(); PDFDOC=await lib.getDocument({data:buf,isEvalSupported:false}).promise; return PDFDOC }
async function openPdf(){ if(PDFDOC) return PDFDOC; const meta=S.scenario.meta; if(!meta||!meta.pdfUrl) throw new Error("PDF bu oturumda yok"); const r=await fetch(meta.pdfUrl); if(!r.ok) throw new Error("PDF açılamadı"); return openPdfData(await r.arrayBuffer()) }
async function pageText(page){ const tc=await page.getTextContent(); let out="", lastY=null;
  for(const it of tc.items){ if(!("str" in it)) continue; const y=it.transform[5]; if(lastY!==null&&Math.abs(y-lastY)>2) out+="\n"; else if(out&&!/\s$/.test(out)&&it.str&&!/^\s/.test(it.str)) out+=" "; out+=it.str; lastY=y; if(it.hasEOL){ out+="\n"; lastY=null } }
  return out.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim() }
async function pageImage(n,scale=1.6){ const doc=await openPdf(); const p=await doc.getPage(n); const vp=p.getViewport({scale}); const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
  await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)); return {blob,w:cv.width,h:cv.height,cv} }
function scMeta(){ return S.scenario.meta||null }
function scPages(){ const out=[]; Object.values(S.scenario).filter(d=>d.id&&d.id.startsWith("pg-")).sort((a,b)=>a.from-b.from).forEach(d=>(d.pages||[]).forEach((t,i)=>out[d.from+i]=t)); return out }

async function importPdf(file){
  if(!file) return; if(file.type!=="application/pdf"&&!/\.pdf$/i.test(file.name)){ toast("Lütfen bir PDF seç"); return }
  try{
    setBusy({msg:"PDF okuyucu yükleniyor…",step:0,total:1});
    const buf=await file.arrayBuffer(); const doc=await openPdfData(buf.slice(0));
    const n=doc.numPages, pages=[];
    for(let i=1;i<=n;i++){ setBusy({msg:`Sayfa ${i}/${n} okunuyor`,step:i,total:n}); pages[i]=await pageText(await doc.getPage(i)) }
    let pdfUrl="";
    if(ASSETS&&file.size<=20*1024*1024){ setBusy({msg:"PDF senin alanına kaydediliyor",step:n,total:n}); try{ const r=await ASSETS.upload(file); pdfUrl=r.url }catch(e){} }
    for(const k of Object.keys(S.scenario)) if(k.startsWith("pg-")) del("scenario",k);
    let chunk={from:1,pages:[]}, idx=0, size=0;
    const flush=()=>{ if(!chunk.pages.length) return; save("scenario",{id:"pg-"+idx,from:chunk.from,pages:chunk.pages}); idx++; chunk={from:chunk.from+chunk.pages.length,pages:[]}; size=0 };
    for(let i=1;i<=n;i++){ const t=pages[i]||""; if(size+t.length>150000||chunk.pages.length>=40) flush(); chunk.pages.push(t); size+=t.length } flush();
    const totalChars=pages.join("").length;
    save("scenario",{id:"meta",title:file.name.replace(/\.pdf$/i,""),fileName:file.name,pageCount:n,pdfUrl,status:"imported",importedAt:Date.now(),textChars:totalChars});
    setBusy(null); S.scTab="guide"; render();
    toast(totalChars<n*200?"PDF okundu ama metin çok az: taranmış bir PDF olabilir, çözümleme zayıf kalır.":`${n} sayfa okundu. Şimdi Claude ile çözümleyebilirsin.`);
  }catch(e){ setBusy(null); toast("PDF okunamadı: "+(e.message||"hata")); render() }
}

"modules":[{"title":"","pages":[0,0],"summary":"2-4 cümle","goal":"bu bölümde oyuncuların amacı","scenes":[{"title":"","page":0,"note":"yöneticiye kısa not"}],"npcs":["isim"],"clues":["ipucu"],"maps":["harita başlığı"],"handouts":["el notu başlığı"]}]}

${brief}`,{signal:sig,cache:{gcTime:86400000}});
    const m=scMeta(); Object.assign(m,{status:"analyzed",analyzedAt:Date.now(),title:fin?.title||m.title,guide:fin?.guide||{},modules:(fin?.modules||[]).map(x=>({...x,id:uid("md")})),npcs,

function relevantPages(q,mod){ const pages=scPages(); const words=String(q).toLocaleLowerCase("tr").split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>3);
  const scored=[]; for(let i=1;i<pages.length;i++){ const t=(pages[i]||"").toLocaleLowerCase("tr"); let s=0; for(const w of words){ let k=t.indexOf(w); while(k>=0&&s<40){ s++; k=t.indexOf(w,k+w.length) } } if(mod&&i>=(mod.pages||[])[0]&&i<=(mod.pages||[])[1]) s+=3; if(s) scored.push([s,i]) }
  scored.sort((a,b)=>b[0]-a[0]); let out="", n=0; for(const [,i] of scored){ const t=pages[i]; if(out.length+t.length>30000||n>=8) break; out+=`\n[Sayfa ${i}]\n${t}`; n++ } return out }

MODÜLLER: ${(m.modules||[]).map((x,i)=>`${i+1}. ${x.title} (s. ${(x.pages||[]).join("-")}): ${x.summary}`).join(" | ").slice(0,8000)}

function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
function auInit(){
  if(AU.ac) return AU.ac; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;

  const comp=ac.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3.5; comp.attack.value=.01; comp.release.value=.25; comp.connect(ac.destination);
  AU.master=ac.createGain(); AU.master.connect(comp);
  AU.music=ac.createGain(); AU.music.connect(AU.master); AU.amb=ac.createGain(); AU.amb.connect(AU.master); AU.sfx=ac.createGain(); AU.sfx.connect(AU.master);
  const len=ac.sampleRate*3, w=ac.createBuffer(1,len,ac.sampleRate), b=ac.createBuffer(1,len,ac.sampleRate), wd=w.getChannelData(0), bd=b.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const r=Math.random()*2-1; wd[i]=r; last=(last+.02*r)/1.02; bd[i]=last*3.5 } AU.white=w; AU.brown=b;
  const ir=ac.createBuffer(2,ac.sampleRate*3.2,ac.sampleRate); for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3) }
  AU.rev=ac.createConvolver(); AU.rev.buffer=ir; const rg=ac.createGain(); rg.gain.value=.5; AU.rev.connect(rg); rg.connect(AU.master);

}
function unlockAudio(){ const ac=auInit(); if(!ac) return; const go=()=>{ AU.locked=false; if(AU.pending){ const p=AU.pending; AU.pending=null; AU.key=null; AU.ambKey=null; applyAudioState(p) } if(AU.el&&AU.el.paused&&AU.wantEl) AU.el.play().catch(()=>{}); renderNowbar() }; if(ac.state==="suspended") ac.resume().then(go).catch(()=>{}); else go() }
document.addEventListener("pointerdown",()=>{ if(AU.locked||(AU.ac&&AU.ac.state==="suspended")||(AU.el&&AU.wantEl&&AU.el.paused)) unlockAudio() },true);

const stVol=()=>S.audio.state?.vol??.8, stAmb=()=>S.audio.state?.ambVol??.6;

function applyVolumes(){ if(AU.ac){ const t=AU.ac.currentTime; AU.master.gain.setTargetAtTime(AU.vol.muted?0:1,t,.05); AU.music.gain.setTargetAtTime(AU.vol.master*AU.vol.music*stVol(),t,.1); AU.amb.gain.setTargetAtTime(AU.vol.master*AU.vol.music*stAmb(),t,.1); AU.sfx.gain.setTargetAtTime(AU.vol.master*AU.vol.sfx,t,.05) }
  if(AU.el) AU.el.volume=Math.max(0,Math.min(1,musicLevel())) }

const NOTE=n=>440*Math.pow(2,(n-69)/12);

const KSC=new Map();

  let lp=0; for(let i=0;i<N;i++){ const x=Math.random()*2-1; lp=lp+(x-lp)*(.25+bright*.75); ring[i]=lp }
  const decay=Math.pow(.001,1/(f*sus)), s=.5-bright*.42; let idx=0;
  for(let i=0;i<n;i++){ const a=ring[idx], c=ring[(idx+1)%N]; const y=decay*((1-s)*a+s*c); d[i]=a; ring[idx]=y; idx=(idx+1)%N }

  if(o.mute) g.gain.setTargetAtTime(0,t+o.mute,.025); s.start(t); s.stop(t+(o.dur||2)) }
