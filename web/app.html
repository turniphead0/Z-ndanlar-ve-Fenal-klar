function genInfo(ref){ ref=LEGACY[ref]||ref; const [a,b]=String(ref).split(":"); if(a==="ortam"&&AMB[b]) return {amb:true,name:AMB[b].name,desc:AMB[b].desc,key:b}; if(STYLES[a]&&MOODS[b]) return {style:a,mood:b,name:`${STYLES[a].name} · ${MOODS[b].name}`,desc:MOODS[b].desc}; return null }
function startGen(ref,startedAt,bus){
  const inf=genInfo(ref); if(!inf) return null; const ac=AU.ac;
  const at=w=>ac.currentTime+Math.max(0,(w-Date.now())/1000);
  if(inf.amb){ const inst=AMB[inf.key].make({out:bus}); const evs=(inst.events||[]).map(([mn,mx,fn])=>({mn,mx,fn,next:Date.now()+mn*500})); let cr=0;
    const tick=()=>{ const now=Date.now(); for(const e of evs) if(now>=e.next){ e.fn(at(now+100)); e.next=now+(e.mn+Math.random()*(e.mx-e.mn))*1000 }
      if(inst.crackle){ if(!cr) cr=now; while(cr<now+400){ burst(at(cr+100),.01+Math.random()*.03,.05+Math.random()*.3,bus,{type:"highpass",f:1500+Math.random()*3000,q:.7}); cr+=40+Math.random()*260 } } };
    return {nodes:inst.nodes,tick} }
  const M=MOODS[inf.mood], St=STYLES[inf.style], sd=60/M.bpm/4, stepMs=sd*1000, seed=(startedAt%100000)|0;
  const trim=(TRIM[inf.style]||{})[inf.mood]??1; const c={M,mood:inf.mood,o:gn(trim,bus),sd,seed,mcache:{}}; if(St.init) St.init(c);
  let next=Math.floor((Date.now()-startedAt)/stepMs)+1;
  const tick=()=>{ const now=Date.now(); while(startedAt+next*stepMs<now+500){ const wall=startedAt+next*stepMs; if(wall>now-40){ const bar=Math.floor(next/16), s=next%16;
      c.bar=bar; c.s=s; c.t=at(wall); c.ch=M.prog[bar%M.prog.length]; c.r=mulberry(seed*7+next*2654435761); c.mel=d=>c.mcache[bar+"|"+d]||(c.mcache[bar+"|"+d]=barMelody(seed,bar,M,c.ch,d));
      if(s===0) for(const k of Object.keys(c.mcache)) if(+k.split("|")[0]<bar-1) delete c.mcache[k];
      try{ St.arr(c) }catch(e){ AU.err=e } } next++ } };
  return {nodes:[],tick};
}

  const can=canSfx();

    <div class="pads">${allPads.map((p,i)=>`<div class="padw"><button class="pad" data-pad="${p.id}" ${can?"":"disabled"}><span>${esc(p.n)}</span>${i<PADKEYS.length&&can?`<kbd>${PADKEYS[i].toUpperCase()}</kbd>`:""}</button>${!p.builtin&&dm?`<button class="padx" data-ac="delsfx" data-id="${p.id}" aria-label="${esc(p.n)} sil">×</button>`:""}</div>`).join("")}</div>
    <p class="hint">${can?"Bir efekte bastığında masadaki herkes duyar. Bu sayfadayken klavye kısayollarını kullanabilirsin.":`Efektleri ${gmT()} çalar; sen de duyarsın.`}</p></section>`;
  return `<div class="vhead"><h1>Ses</h1></div><div class="audio">${now}${mine}</div>${gens}${board}${tracks}`;
}
async function uploadAudioFile(f){
  if(f.size>20*1024*1024) throw {code:"too_large",message:`${f.name} 20 MB'tan büyük`};
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const tries=[f.type,/^(webm|ogg|opus|oga)$/.test(ext)?"video/webm":"video/mp4"].filter((t,i,a)=>t&&a.indexOf(t)===i); let last;
  for(const t of tries){ try{ return await ASSETS.upload(f,{type:t}) }catch(e){ last=e; if(e&&e.code!=="unsupported_type") throw e } } throw last;
}
function fileDuration(f){ return new Promise(res=>{ const a=new Audio(); const u=URL.createObjectURL(f); a.preload="metadata"; a.onloadedmetadata=()=>{ res(a.duration||0); URL.revokeObjectURL(u) }; a.onerror=()=>{ res(0); URL.revokeObjectURL(u) }; a.src=u }) }
main.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.up){ const files=[...el.files]; el.value=""; if(!files.length||!ASSETS) return; let ok=0;
    for(const [i,f] of files.entries()){ S.auUp=`${f.name} yükleniyor (${i+1}/${files.length})…`; render();
      try{ const dur=await fileDuration(f); const r=await uploadAudioFile(f); const title=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();
        if(el.dataset.up==="track") save("tracks",{id:uid("tr"),kind:"file",title,url:r.url,assetId:r.id,dur,size:f.size,by:ME.id,created:Date.now()}); else save("sfx",{id:uid("sx"),name:title.slice(0,24),url:r.url,assetId:r.id,by:ME.id,created:Date.now()}); ok++ }
      catch(err){ toast(err.code==="too_large"?err.message+"; daha düşük bit hızıyla dışa aktar":err.code==="unsupported_type"?`${f.name}: bu dosya türü yüklenemiyor, MP3 dene`:`${f.name} yüklenemedi`) } }
    S.auUp=""; render(); if(ok) toast(`${ok} dosya eklendi`); return }
  if(el.dataset.ac==="auto"){ setAudio({auto:el.checked}); return }
  if(el.dataset.ac==="sfxplayers"){ const g=S.games[G.id]; g.sfxPlayers=el.checked; saveGame(g,["sfxPlayers"]); return }
  if(el.dataset.dicesfx){ AU.vol.dice=el.checked; saveVol(); return }
});
main.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset.vol){ AU.vol[el.dataset.vol]=+el.value; saveVol(); el.nextElementSibling.textContent=Math.round(el.value*100); return }
  if(el.dataset.tvol){ el.nextElementSibling.textContent=Math.round(el.value*100); const k=el.dataset.tvol, v=+el.value; const st=S.audio.state; if(st){ st[k]=v; applyVolumes() } clearTimeout(AU.tv); AU.tv=setTimeout(()=>{ const st=S.audio.state; if(st){ st[k]=v; save("audio",st,[k]) } },250) }
});
main.addEventListener("submit",e=>{ if(!e.target.dataset.ytform) return; e.preventDefault(); const p=parseYt($("#ytUrl").value); if(!p){ toast("Bu bir YouTube bağlantısına benzemiyor"); $("#ytUrl").focus(); return }
  save("tracks",{id:uid("yt"),kind:"yt",ytId:p.id,list:p.list,title:$("#ytTitle").value.trim()||"YouTube videosu",by:ME.id,created:Date.now()}); render(); toast("YouTube bağlantısı eklendi") });
main.addEventListener("click",e=>{
  const cb=e.target.closest("[data-aucat]"); if(cb){ S.auCat=cb.dataset.aucat; render(); return }
  const pad=e.target.closest("[data-pad]"); if(pad){ triggerSfx(pad.dataset.pad); return }
  const b=e.target.closest("[data-ac]"); if(!b||b.tagName==="INPUT") return; const a=b.dataset.ac, st=S.audio.state;
  if(!isDM()) return;
  switch(a){
    case "gen": setAudio({kind:"gen",ref:b.dataset.id,playing:true,loop:true}); break;
    case "amb": setAmb(b.dataset.id); break;
    case "ambstop": setAmb(null); break;
    case "file": setAudio({kind:"file",ref:b.dataset.id,playing:true,loop:false}); break;
    case "fileloop": setAudio({kind:"file",ref:b.dataset.id,playing:true,loop:true}); break;
    case "yt": setAudio({kind:"yt",ref:b.dataset.id,playing:true,loop:false}); break;
    case "stop": setAudio({playing:false}); break;
    case "loop": if(st){ st.loop=!st.loop; save("audio",st,["loop"]); if(AU.el) AU.el.loop=st.loop; render() } break;
    case "next": { const list=trackList().filter(x=>x.kind!=="yt"); const i=list.findIndex(x=>x.id===st?.ref); const nx=list[(i+1)%Math.max(1,list.length)]; if(nx) setAudio({kind:"file",ref:nx.id,playing:true,loop:false}); break }
    case "deltrack": armed(b,()=>{ const tr=S.tracks[b.dataset.id]; if(st&&st.ref===tr.id&&st.playing) setAudio({playing:false}); del("tracks",tr.id); if(tr.assetId&&ASSETS) ASSETS.delete(tr.assetId).catch(()=>{}); render() }); break;
    case "delsfx": armed(b,()=>{ const x=S.sfx[b.dataset.id]; del("sfx",x.id); if(x.assetId&&ASSETS) ASSETS.delete(x.assetId).catch(()=>{}); render() }); break;
  }
});
document.addEventListener("keydown",e=>{ if(!G.id||S.view!=="ses"||editing()||e.ctrlKey||e.metaKey||e.altKey) return; const i=PADKEYS.indexOf(e.key.toLowerCase()); if(i<0) return; const pads=$$("[data-pad]"); if(pads[i]&&!pads[i].disabled){ e.preventDefault(); triggerSfx(pads[i].dataset.pad) } });
setInterval(()=>{ if(S.view==="ses") updateProgress() },1000);

$("#bgFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; const m=curMap(); if(!f||!m) return;
  const sz=await imgSize(f).catch(()=>null); if(sz){ m.bgW=sz.w; m.bgH=sz.h }
  if(ASSETS){ try{ toast("Görsel yükleniyor…"); const r=await ASSETS.upload(f); m.bg=r.url; save("maps",m,["bg","bgW","bgH"]); render(); toast("Arka plan eklendi"); return }catch(err){ toast("Görsel yüklenemedi: "+(err.message||err.code||"hata")) } }
  else { m.bg=URL.createObjectURL(f); render(); toast("Görsel yalnızca bu oturumda görünür (kalıcı depolama yok)") }
});
function imgSize(f){ const url=URL.createObjectURL(f); return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>{ ok({w:i.naturalWidth,h:i.naturalHeight}); URL.revokeObjectURL(url) }; i.onerror=()=>{ URL.revokeObjectURL(url); no(new Error("Resim okunamadı")) }; i.src=url }) }
// Resimden harita: resim haritanın kendisi olur. Kare sayısı resmin boyutundan tahmin edilir (yaklaşık 70 piksel bir kare), Sütun ile düzeltilir.
$("#mapImgFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||!isDM()) return;
  let sz; try{ sz=await imgSize(f) }catch(err){ toast("Bu dosya resim olarak açılamadı"); return }
  const cols=Math.max(5,Math.min(100,Math.round(sz.w/70))), rows=Math.max(5,Math.min(100,Math.round(cols*sz.h/sz.w)));
  const m=newMap(); Object.assign(m,{name:f.name.replace(/\.[^.]+$/,"")||"Resim haritası",cols,rows,bgW:sz.w,bgH:sz.h});
  if(ASSETS){ try{ toast("Harita resmi yükleniyor…"); m.bg=(await ASSETS.upload(f)).url }catch(err){ toast("Resim yüklenemedi: "+(err.message||err.code||"hata")); return } }
  else m.bg=URL.createObjectURL(f);
  save("maps",m); S.mapId=m.id; S.selTok=null; S.selLab=null; S.view="harita"; render();
  toast(`Harita hazır: ${cols}×${rows} kare. Kareler resimdeki ızgaraya uymuyorsa Harita panelinden Sütun sayısını değiştir.`);
});
// Jeton resmi: 256 px kareye kırpılıp küçültülür, sonra yüklenir.
async function squareImage(f,size=256){ const url=URL.createObjectURL(f); try{ const im=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url });
  const c=Math.min(im.naturalWidth,im.naturalHeight), cv=document.createElement("canvas"); cv.width=cv.height=Math.min(size,c); cv.getContext("2d").drawImage(im,(im.naturalWidth-c)/2,(im.naturalHeight-c)/2,c,c,0,0,cv.width,cv.height);
  const blob=await new Promise(ok=>cv.toBlob(ok,"image/webp",.88)); return blob&&blob.type==="image/webp"?new File([blob],"jeton.webp",{type:"image/webp"}):await new Promise(ok=>cv.toBlob(b=>ok(new File([b],"jeton.png",{type:"image/png"})),"image/png")) } finally{ URL.revokeObjectURL(url) } }
function setTokImg(m,t,url){
  if(t.charId&&S.chars[t.charId]){ const ch=S.chars[t.charId]; if(!canEditChar(ch)){ toast("Bu karakterin portresini yalnızca sahibi değiştirebilir"); return } ch.portrait=url; save("chars",ch,["portrait"]) }
  else if(t.monsterId&&isDM()){ const mo=S.monsters[t.monsterId]; if(mo){ mo.img=url; save("monsters",mo,["img"]) }
    for(const mp of Object.values(S.maps)){ const ps=[]; for(const x of toks(mp)) if(x.monsterId===t.monsterId){ x.img=url; ps.push("tokens."+x.id+".img") } if(ps.length) save("maps",mp,ps) } }
  else { t.img=url; save("maps",m,["tokens."+t.id+".img"]) }
  render(); toast(url?"Jeton resmi eklendi":"Jeton resmi kaldırıldı") }
$("#tokFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; const m=curMap(); const t=m&&m.tokens[S.selTok]; if(!f||!t) return;
  let file=f; try{ file=await squareImage(f) }catch(err){}
  if(ASSETS){ try{ toast("Resim yükleniyor…"); const r=await ASSETS.upload(file); setTokImg(m,t,r.url); return }catch(err){ toast("Resim yüklenemedi: "+(err.message||err.code||"hata")); return } }
  setTokImg(m,t,URL.createObjectURL(file)); toast("Resim yalnızca bu oturumda görünür (kalıcı depolama yok)")
});
$("#turnbar").addEventListener("click",e=>{ if(e.target.closest("[data-tb=next]")) stepTurn(1) });
$("#dmbar").addEventListener("click",e=>{ const b=e.target.closest("[data-vm]"); if(!b) return; S.asPlayer=b.dataset.vm==="player"; if(S.asPlayer&&S.noteCat==="DM") S.noteCat="Tümü"; renderDmbar(); render(); renderTurnbar(); renderLog(); if(S.asPlayer&&$("#result .sec")) showResult({label:"Hazır",total:"—",detail:"",crit:null}); toast(S.asPlayer?"Oyuncuların gördüğü görünümdesin":"DM görünümüne döndün") });
$("#secretRoll").addEventListener("change",e=>{ S.secret=e.target.checked });
document.addEventListener("keydown",e=>{ if(!G.id||S.view!=="harita"||editing()||!isDM()) return; const k=e.key.toLowerCase(); if((e.ctrlKey||e.metaKey)&&k==="z"){ e.preventDefault(); undo(e.shiftKey?1:-1) } else if((e.ctrlKey||e.metaKey)&&k==="y"){ e.preventDefault(); undo(1) } });
function renderDmbar(){ const el=$("#dmbar"); if(!el) return; el.hidden=G.role!=="dm"; const vb=$$("[data-vm]",el); if(vb.length===2){ vb[0].textContent=gmT()+" görünümü"; vb[1].textContent="Oyuncu görünümü" } $$("[data-vm]",el).forEach(b=>b.setAttribute("aria-pressed",(b.dataset.vm==="player")===!!S.asPlayer)); $("#secretWrap").hidden=!isDM() }
window.addEventListener("resize",()=>{ if(innerWidth>1000) $("#tray").classList.remove("open") });
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>drawMap());
new MutationObserver(()=>drawMap()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","data-sys","data-yzp"]});

init();
